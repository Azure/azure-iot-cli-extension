trigger: none
pr: none
name: release-feed-probe-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: mode
    displayName: Diagnostic branch only checks package-feed access
    type: string
    default: FeedCheck
    values: [FeedCheck]

resources:
  repositories:
    - repository: governedTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/stable

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@governedTemplates
  parameters:
    pool:
      name: iotupx-1espt-release-probe
      image: iotupx-1espt-ubuntu2404
      os: linux
    sdl:
      sourceAnalysisPool:
        name: iotupx-1espt-release-probe
        image: iotupx-1espt-windows2025
        os: windows
    stages:
      - stage: FeedAccess
        displayName: Verify Build Service access to the selected Python feed
        jobs:
          - job: FeedAccess
            timeoutInMinutes: 15
            steps:
              - checkout: self
                clean: true
                persistCredentials: false
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: "3.13"
              - task: PipAuthenticate@1
                displayName: Authenticate the pipeline Build Service to the project feed
                inputs:
                  artifactFeeds: aziotcli/pip
                  onlyAddExtraIndex: false
              - script: python scripts/release_feed_probe.py
                displayName: Download build tooling from the feed without installing or publishing
                env:
                  RELEASE_PIP_FEED_URL: https://pkgs.dev.azure.com/azureiotdevxp/aziotcli/_packaging/pip/pypi/simple/

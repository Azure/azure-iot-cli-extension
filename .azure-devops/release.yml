trigger: none
pr: none
name: release-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: mode
    displayName: Plan is offline; Validate runs live tests; Release also publishes
    type: string
    default: Plan
    values: [Plan, Validate, Release]
  - name: sourceBranch
    displayName: Protected branch containing the candidate and pipeline 147 migration
    type: string
    default: release/1.1.0-preview
    values: [dev, preview, release/1.1.0-preview]

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Resolve
    displayName: Freeze source and validate prerequisites
    jobs:
      - job: Resolve
        steps:
          - checkout: self
            clean: true
            persistCredentials: false
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.13"
          - ${{ if eq(parameters.mode, 'Plan') }}:
              - script: python scripts/release_pipeline.py plan
                displayName: Show nonpublishing onboarding plan
                env:
                  RELEASE_SOURCE_BRANCH: ${{ parameters.sourceBranch }}
          - ${{ if ne(parameters.mode, 'Plan') }}:
              - script: python scripts/release_pipeline.py resolve --source "$(Agent.TempDirectory)/release-source"
                name: source
                displayName: Resolve and verify the immutable source
                env:
                  RELEASE_SOURCE_BRANCH: ${{ parameters.sourceBranch }}
                  RELEASE_PIP_FEED_URL: $(ReleasePipFeedUrl)
                  RELEASE_MODE: ${{ parameters.mode }}

  - ${{ if ne(parameters.mode, 'Plan') }}:
      - stage: Build
        dependsOn: Resolve
        variables:
          sourceCommit: $[ stageDependencies.Resolve.Resolve.outputs['source.commit'] ]
        jobs:
          - job: Build
            timeoutInMinutes: 45
            steps:
              - template: templates/release-source.yml
                parameters:
                  sourceBranch: ${{ parameters.sourceBranch }}
              - task: AzureCLI@2
                displayName: Build wheel and runtime SBOM using the authenticated package feed
                inputs:
                  azureSubscription: $(ReleaseAzureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  visibleAzLogin: false
                  inlineScript: >-
                    python scripts/release_pipeline.py build
                    --source "$(Agent.TempDirectory)/release-source"
                    --work-dir "$(Agent.TempDirectory)"
                env:
                  RELEASE_PIP_FEED_URL: $(ReleasePipFeedUrl)
              - script: >-
                  python scripts/release_pipeline.py candidate
                  --source "$(Agent.TempDirectory)/release-source"
                  --directory "$(Build.ArtifactStagingDirectory)/release-candidate"
                displayName: Record exact source, producer, version and asset digests
                env:
                  RELEASE_SOURCE_BRANCH: ${{ parameters.sourceBranch }}
                  RELEASE_SOURCE_COMMIT: $(sourceCommit)
              - publish: $(Build.ArtifactStagingDirectory)/release-candidate
                artifact: release-candidate

      - stage: Unit
        displayName: Full release unit and style matrix
        dependsOn: Resolve
        variables:
          sourceCommit: $[ stageDependencies.Resolve.Resolve.outputs['source.commit'] ]
        jobs:
          - job: Unit
            timeoutInMinutes: 90
            strategy:
              matrix:
                Ubuntu310: {image: ubuntu-24.04, python: "3.10"}
                Ubuntu311: {image: ubuntu-24.04, python: "3.11"}
                Ubuntu312: {image: ubuntu-24.04, python: "3.12"}
                Ubuntu313: {image: ubuntu-24.04, python: "3.13"}
                Windows310: {image: windows-2025, python: "3.10"}
                Windows311: {image: windows-2025, python: "3.11"}
                Windows312: {image: windows-2025, python: "3.12"}
                Windows313: {image: windows-2025, python: "3.13"}
                Mac310: {image: macOS-15, python: "3.10"}
                Mac311: {image: macOS-15, python: "3.11"}
                Mac312: {image: macOS-15, python: "3.12"}
                Mac313: {image: macOS-15, python: "3.13"}
            pool:
              vmImage: $(image)
            steps:
              - template: templates/release-source.yml
                parameters:
                  sourceBranch: ${{ parameters.sourceBranch }}
                  pythonVersion: $(python)
              - bash: |
                  source scripts/select-openssl.sh
                  echo "##vso[task.prependpath]$openssl_bin"
                displayName: Select capability-checked OpenSSL 3 on macOS
                condition: and(succeeded(), eq(variables['Agent.OS'], 'Darwin'))
                workingDirectory: $(Agent.TempDirectory)/release-source
              - script: python -m pip install tox
              - script: tox run -vv --notest
                workingDirectory: $(Agent.TempDirectory)/release-source
              - script: tox run --skip-pkg-install
                displayName: Run existing clean, lint, serial unit and coverage environments
                workingDirectory: $(Agent.TempDirectory)/release-source
              - task: PublishTestResults@2
                condition: always()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: $(Agent.TempDirectory)/release-source/junit/test-iotext-unit.xml
                  testRunTitle: $(image) Python $(python)
                  failTaskOnFailedTests: true
                  failTaskOnMissingResultsFile: true

      - stage: Security
        dependsOn: Resolve
        variables:
          sourceCommit: $[ stageDependencies.Resolve.Resolve.outputs['source.commit'] ]
        jobs:
          - job: Security
            pool:
              vmImage: windows-2025
            steps:
              - template: templates/release-source.yml
                parameters:
                  sourceBranch: ${{ parameters.sourceBranch }}
              - pwsh: |
                  git fetch --no-tags "$env:SOURCE" "$env:SOURCE_COMMIT"
                  if ($LASTEXITCODE -ne 0) { throw "Cannot fetch the qualified security checkout." }
                  git checkout --detach "$env:SOURCE_COMMIT"
                  if ($LASTEXITCODE -ne 0) { throw "Cannot select the qualified security checkout." }
                  if ((git rev-parse HEAD) -ne $env:SOURCE_COMMIT) { throw "Security source mismatch." }
                displayName: Put the qualified source at the native scanner's repository root
                env:
                  SOURCE: $(Agent.TempDirectory)/release-source
                  SOURCE_COMMIT: $(sourceCommit)
              - task: UseDotNet@2
                inputs:
                  packageType: sdk
                  version: 5.0.x
              - task: UseDotNet@2
                inputs:
                  packageType: sdk
                  version: 6.0.x
              - task: MicrosoftSecurityDevOps@1
                displayName: Run the existing security tool suite; fail on high findings
                inputs:
                  break: true
                  publish: true
                  artifactName: release-security-$(System.JobAttempt)
                env:
                  GDN_BANDIT_TARGET: $(Build.SourcesDirectory)/azext_iot
                  GDN_BANDIT_RECURSIVE: "true"
                  BUILD_SOURCEVERSION: $(sourceCommit)
                  BUILD_SOURCEBRANCH: refs/heads/${{ parameters.sourceBranch }}

      - stage: CommandLint
        dependsOn: [Resolve, Build]
        variables:
          sourceCommit: $[ stageDependencies.Resolve.Resolve.outputs['source.commit'] ]
        jobs:
          - job: CommandLint
            timeoutInMinutes: 45
            steps:
              - template: templates/release-source.yml
                parameters:
                  sourceBranch: ${{ parameters.sourceBranch }}
              - download: current
                artifact: release-candidate
              - script: python scripts/release_pipeline.py verify --directory "$(Pipeline.Workspace)/release-candidate"
                env:
                  RELEASE_SOURCE_BRANCH: ${{ parameters.sourceBranch }}
                  RELEASE_SOURCE_COMMIT: $(sourceCommit)
              - bash: |
                  set -euo pipefail
                  python -m venv "$AGENT_TEMPDIRECTORY/lint-venv"
                  source "$AGENT_TEMPDIRECTORY/lint-venv/bin/activate"
                  cd "$SOURCE"
                  python -m pip install -r dev_requirements azdev
                  git clone --quiet --depth=1 --branch dev https://github.com/Azure/azure-cli.git \
                    "$AGENT_TEMPDIRECTORY/azure-cli"
                  azdev setup -c "$AGENT_TEMPDIRECTORY/azure-cli" -r "$SOURCE"
                  az extension add --source "$CANDIDATE/"*.whl --yes
                  cp linter_exclusions.yml "$AZURE_EXTENSION_DIR/azure-iot/"
                  cp .pylintrc pylintrc
                  azdev linter --include-whl-extensions azure-iot --min-severity medium
                displayName: Run the existing release command-table linter
                env:
                  SOURCE: $(Agent.TempDirectory)/release-source
                  CANDIDATE: $(Pipeline.Workspace)/release-candidate
                  AZURE_CONFIG_DIR: $(Agent.TempDirectory)/lint-config
                  AZDEV_CONFIG_DIR: $(Agent.TempDirectory)/lint-azdev-config
                  AZURE_EXTENSION_DIR: $(Agent.TempDirectory)/lint-extensions

      - stage: IndexCompatibility
        displayName: Required external-wheel index compatibility
        dependsOn: [Resolve, Build]
        variables:
          sourceCommit: $[ stageDependencies.Resolve.Resolve.outputs['source.commit'] ]
        jobs:
          - job: IndexCompatibility
            timeoutInMinutes: 45
            steps:
              - template: templates/release-source.yml
                parameters:
                  sourceBranch: ${{ parameters.sourceBranch }}
                  pythonVersion: "3.14"
              - download: current
                artifact: release-candidate
              - bash: |
                  set -euo pipefail
                  mkdir -p "$COMPAT_ROOT/run" "$COMPAT_ROOT/wheels" "$COMPAT_ROOT/reports"
                  cp "$CANDIDATE/"*.whl "$COMPAT_ROOT/wheels/"
                  unset PYTHONHOME
                  python -m venv "$COMPAT_ROOT/venv"
                  source "$COMPAT_ROOT/venv/bin/activate"
                  cd "$COMPAT_ROOT/run"
                  git clone --quiet --depth=1 --branch dev https://github.com/Azure/azure-cli.git \
                    "$COMPAT_ROOT/azure-cli"
                  git clone --quiet --depth=1 --branch main https://github.com/Azure/azure-cli-extensions.git \
                    "$COMPAT_ROOT/azure-cli-extensions"
                  python -m pip install --upgrade pip
                  python -m pip install azdev==0.2.13 build wheel
                  azdev setup -c "$COMPAT_ROOT/azure-cli" -r "$COMPAT_ROOT/azure-cli-extensions"
                  python "$BUILD_SOURCESDIRECTORY/scripts/release_pipeline.py" index-check \
                    --source "$SOURCE" --directory "$CANDIDATE" --work-dir "$COMPAT_ROOT"
                displayName: Reuse the provenance-checking index linter as a mandatory gate
                env:
                  SOURCE: $(Agent.TempDirectory)/release-source
                  CANDIDATE: $(Pipeline.Workspace)/release-candidate
                  COMPAT_ROOT: $(Agent.TempDirectory)/index-compatibility
                  AZURE_CONFIG_DIR: $(Agent.TempDirectory)/index-compatibility/azure-config
                  AZDEV_CONFIG_DIR: $(Agent.TempDirectory)/index-compatibility/azdev-config
                  AZURE_EXTENSION_DIR: $(Agent.TempDirectory)/index-compatibility/extensions
                  AZURE_EXTENSION_DEV_SOURCES: $(Agent.TempDirectory)/index-compatibility/azure-cli-extensions
                  AZURE_CORE_COLLECT_TELEMETRY: "no"
                  PYTHONNOUSERSITE: "1"
                  PYTHONPATH: ""
                  RELEASE_SOURCE_BRANCH: ${{ parameters.sourceBranch }}
                  RELEASE_SOURCE_COMMIT: $(sourceCommit)
              - publish: $(Agent.TempDirectory)/index-compatibility/reports
                condition: always()
                artifact: release-index-compatibility-$(System.JobAttempt)

      - stage: Integration
        displayName: Qualify the same wheel through pipeline 147
        dependsOn: [Resolve, Build, Unit, Security, CommandLint, IndexCompatibility]
        condition: >-
          and(not(canceled()), eq(dependencies.Resolve.result, 'Succeeded'),
          eq(dependencies.Build.result, 'Succeeded'), eq(dependencies.Unit.result, 'Succeeded'),
          eq(dependencies.Security.result, 'Succeeded'), eq(dependencies.CommandLint.result, 'Succeeded'),
          eq(dependencies.IndexCompatibility.result, 'Succeeded'))
        variables:
          sourceCommit: $[ stageDependencies.Resolve.Resolve.outputs['source.commit'] ]
        jobs:
          - job: Integration
            timeoutInMinutes: 360
            cancelTimeoutInMinutes: 5
            steps:
              - checkout: self
                clean: true
                persistCredentials: false
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: "3.13"
              - download: current
                artifact: release-candidate
              - script: >-
                  python scripts/release_pipeline.py integrate
                  --directory "$(Pipeline.Workspace)/release-candidate"
                  --record "$(Agent.TempDirectory)/integration-run.json"
                displayName: Queue or reattach to the exact child and require Succeeded
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  RELEASE_SOURCE_BRANCH: ${{ parameters.sourceBranch }}
                  RELEASE_SOURCE_COMMIT: $(sourceCommit)
              - task: DownloadPipelineArtifact@2
                inputs:
                  buildType: specific
                  project: $(System.TeamProjectId)
                  definition: "147"
                  buildVersionToDownload: specific
                  pipelineId: $(integrationBuildId)
                  patterns: "integration-wheel-*/**"
                  targetPath: $(Agent.TempDirectory)/integration-artifacts
              - script: >-
                  python scripts/release_pipeline.py verify-integration
                  --directory "$(Pipeline.Workspace)/release-candidate"
                  --work-dir "$(Agent.TempDirectory)/integration-artifacts"
                env:
                  RELEASE_SOURCE_BRANCH: ${{ parameters.sourceBranch }}
                  RELEASE_SOURCE_COMMIT: $(sourceCommit)
              - script: >-
                  python scripts/release_pipeline.py cancel
                  --directory "$(Pipeline.Workspace)/release-candidate"
                  --record "$(Agent.TempDirectory)/integration-run.json"
                displayName: Cancel only this release's child on interruption or failure
                condition: or(failed(), canceled())
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  RELEASE_SOURCE_BRANCH: ${{ parameters.sourceBranch }}
                  RELEASE_SOURCE_COMMIT: $(sourceCommit)
              - publish: $(Agent.TempDirectory)/integration-run.json
                condition: always()
                artifact: release-integration-$(System.JobAttempt)

  - ${{ if eq(parameters.mode, 'Release') }}:
      - stage: Publish
        displayName: Publish the qualified GitHub release
        dependsOn: [Resolve, Build, Unit, Security, CommandLint, IndexCompatibility, Integration]
        condition: >-
          and(not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/dev'),
          eq(dependencies.Resolve.result, 'Succeeded'), eq(dependencies.Build.result, 'Succeeded'),
          eq(dependencies.Unit.result, 'Succeeded'), eq(dependencies.Security.result, 'Succeeded'),
          eq(dependencies.CommandLint.result, 'Succeeded'), eq(dependencies.IndexCompatibility.result, 'Succeeded'),
          eq(dependencies.Integration.result, 'Succeeded'))
        variables:
          - group: aziotcli_release_publish
          - name: sourceCommit
            value: $[ stageDependencies.Resolve.Resolve.outputs['source.commit'] ]
        jobs:
          - job: Publish
            steps:
              - checkout: self
                clean: true
                persistCredentials: false
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: "3.13"
              - script: python -m pip install packaging
              - download: current
                artifact: release-candidate
              - script: >-
                  python scripts/release_pipeline.py publish
                  --directory "$(Pipeline.Workspace)/release-candidate"
                  --record "$(Build.ArtifactStagingDirectory)/publication/release.json"
                env:
                  RELEASE_SOURCE_BRANCH: ${{ parameters.sourceBranch }}
                  RELEASE_SOURCE_COMMIT: $(sourceCommit)
                  RELEASE_GITHUB_TOKEN: $(ReleaseGitHubToken)
              - publish: $(Build.ArtifactStagingDirectory)/publication
                artifact: release-publication

      - stage: IndexPR
        displayName: Submit index PR; never merge it
        dependsOn: [Resolve, Build, Publish]
        condition: >-
          and(not(canceled()), eq(dependencies.Resolve.result, 'Succeeded'),
          eq(dependencies.Build.result, 'Succeeded'), eq(dependencies.Publish.result, 'Succeeded'))
        variables:
          - group: aziotcli_release_publish
          - name: sourceCommit
            value: $[ stageDependencies.Resolve.Resolve.outputs['source.commit'] ]
        jobs:
          - job: IndexPR
            steps:
              - checkout: self
                clean: true
                persistCredentials: false
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: "3.13"
              - script: python -m pip install azdev==0.2.13
              - download: current
                artifact: release-candidate
              - download: current
                artifact: release-publication
              - script: >-
                  python scripts/release_pipeline.py index
                  --directory "$(Pipeline.Workspace)/release-candidate"
                  --record "$(Pipeline.Workspace)/release-publication/release.json"
                  --work-dir "$(Agent.TempDirectory)/index-submission"
                env:
                  RELEASE_SOURCE_BRANCH: ${{ parameters.sourceBranch }}
                  RELEASE_SOURCE_COMMIT: $(sourceCommit)
                  RELEASE_GITHUB_TOKEN: $(ReleaseGitHubToken)
                  INDEX_FORK_REPOSITORY: $(IndexForkRepository)
                  AZURE_CONFIG_DIR: $(Agent.TempDirectory)/index-submission/azure-config
                  AZDEV_CONFIG_DIR: $(Agent.TempDirectory)/index-submission/azdev-config
                  PYTHONNOUSERSITE: "1"
                  PYTHONPATH: ""
              - publish: $(Agent.TempDirectory)/index-submission/index-pr.json
                artifact: release-index-pr

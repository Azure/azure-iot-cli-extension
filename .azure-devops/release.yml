trigger: none
pr: none
name: partial-no-msdo-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: mode
    displayName: Partial diagnostics only; MSDO missing; no release qualification or publication
    type: string
    default: Partial
    values: [Partial]
  - name: sourceBranch
    displayName: Pinned integration PR source
    type: string
    default: users/hangyiwang/ado147-integration-parity-retries
    values: [users/hangyiwang/ado147-integration-parity-retries]

resources:
  repositories:
    - repository: governedTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/stable

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@governedTemplates
  parameters:
    pool:
      name: iotupx-1espt-release-probe
      image: iotupx-1espt-ubuntu2404
      os: linux
    sdl:
      sourceAnalysisPool:
        name: iotupx-1espt-release-probe
        image: iotupx-1espt-windows2025
        os: windows
    stages:
      - template: templates/release-stages.yml
        parameters:
          mode: ${{ parameters.mode }}
          sourceBranch: ${{ parameters.sourceBranch }}

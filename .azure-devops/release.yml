trigger: none
pr: none
name: release-environment-probe-$(Date:yyyyMMdd).$(Rev:r)
appendCommitMessageToRunName: false

resources:
  repositories:
    - repository: governedTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/stable

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@governedTemplates
  parameters:
    pool:
      name: iotupx-1espt-release-probe
      image: iotupx-1espt-ubuntu2404
      os: linux
    sdl:
      sourceAnalysisPool:
        name: iotupx-1espt-release-probe
        image: iotupx-1espt-windows2025
        os: windows
    stages:
      - stage: EnvironmentProbe
        jobs:
          - job: LinuxTLS
            timeoutInMinutes: 20
            steps:
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '3.14'
              - template: /.azure-devops/templates/release-feed.yml@self
              - bash: |
                  set -euo pipefail
                  python -m venv "$AGENT_TEMPDIRECTORY/trust-probe"
                  "$AGENT_TEMPDIRECTORY/trust-probe/bin/python" -m pip install \
                    requests==2.34.2 certifi==2026.10.23
                  "$AGENT_TEMPDIRECTORY/trust-probe/bin/python" scripts/release_env_probe.py tls
                displayName: Compare verified certificate stores
          - job: MacOSDependencies
            timeoutInMinutes: 60
            pool:
              name: Azure Pipelines
              image: macOS-15
              os: macOS
            steps:
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '3.13'
              - template: /.azure-devops/templates/release-feed.yml@self
              - bash: |
                  set -euo pipefail
                  git init --quiet "$AGENT_TEMPDIRECTORY/ops-source"
                  cd "$AGENT_TEMPDIRECTORY/ops-source"
                  git remote add origin https://github.com/Azure/azure-iot-ops-cli-extension.git
                  git fetch --quiet --depth=1 origin 6b2f3726e4a5cf355044077467caea726388773e
                  git checkout --quiet --detach FETCH_HEAD
                  test "$(git rev-parse HEAD)" = 6b2f3726e4a5cf355044077467caea726388773e
                  python "$BUILD_SOURCESDIRECTORY/scripts/release_env_probe.py" inventory
                  python -m pip install tox
                  python -m tox run --notest -e python -x "testenv:python.pass_env+=PIP_*"
                displayName: Reproduce original dependency environment
              - bash: |
                  set -euo pipefail
                  cd "$AGENT_TEMPDIRECTORY/ops-source"
                  .tox/python/bin/python "$BUILD_SOURCESDIRECTORY/scripts/release_env_probe.py" inventory
                  .tox/python/bin/python -I "$BUILD_SOURCESDIRECTORY/scripts/release_env_probe.py" inventory
                  .tox/python/bin/python -m pip check
                condition: always()
                displayName: Identify installed versions and dependency origin

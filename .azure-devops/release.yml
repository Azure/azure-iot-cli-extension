trigger: none
pr: none
name: iot-release-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: mode
    displayName: Mode
    type: string
    default: Plan
    values: [Plan, Validate, Draft, Release]
  - name: sourceBranch
    displayName: Release branch
    type: string
    default: release/1.2.0-preview
  - name: createIndexPr
    displayName: Create index PR
    type: boolean
    default: false
  - name: skipIntegrationTests
    displayName: Skip integration tests
    type: boolean
    default: false
  - name: regions
    displayName: Region (Public cloud only)
    type: stringList
    default:
      - Australia East
    values:
      - Australia East
      - Japan East
      - Central US
      - UK South
      - West US
      - West US 3
      - East US
      - West Europe

variables:
  RELEASE_REGION: ${{ lower(replace(join(',', parameters.regions), ' ', '')) }}
  RELEASE_SKIP_INTEGRATION_TESTS: ${{ parameters.skipIntegrationTests }}

resources:
  repositories:
    - repository: governedTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/stable

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@governedTemplates
  parameters:
    pool:
      name: iotupx-1espt-release-probe
      image: iotupx-1espt-ubuntu2404
      os: linux
    sdl:
      sourceAnalysisPool:
        name: iotupx-1espt-release-probe
        image: iotupx-1espt-windows2025
        os: windows
    stages:
      - template: templates/release-stages.yml
        parameters:
          mode: ${{ parameters.mode }}
          sourceBranch: ${{ parameters.sourceBranch }}
          createIndexPr: ${{ parameters.createIndexPr }}
          skipIntegrationTests: ${{ parameters.skipIntegrationTests }}

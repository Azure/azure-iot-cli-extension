# Required for schedule only trigger
trigger: none
pr: none

# Run daily at 5 am (Pacific).
schedules:
  - cron: "0 13 * * *"
    displayName: "Daily Cleanup"
    branches:
      include:
        - dev
    always: true

parameters:
  - name: resourceGroupVar
    type: string
    default: "ResourceGroup"
  - name: exclusionsVar
    type: string
    default: "Exclusions"

variables:
  - name: targetResourceGroup
    value: $[variables.${{ parameters.resourceGroupVar }}]
  - name: deleteExclusions
    value: $[variables.${{ parameters.exclusionsVar }}]

pool:
  vmImage: ubuntu-24.04

steps:
  - checkout: self
    clean: true
    persistCredentials: false

  - task: AzureCLI@2
    displayName: "Delete expired owned test resources"
    inputs:
      azureSubscription: $(AzureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: python3 scripts/cleanup_test_resources.py
    env:
      RESOURCEGROUP: $(targetResourceGroup)
      EXCLUSIONS: $(deleteExclusions)

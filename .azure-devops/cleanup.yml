trigger: none
pr: none

# Scheduled runs use the report-only parameter default, regardless of source changes.
schedules:
  - cron: "0 13 * * *"
    displayName: "Daily owned-resource report (13:00 UTC)"
    branches:
      include:
        - dev
    always: true

parameters:
  - name: mode
    displayName: Cleanup mode
    type: string
    default: report
    values: [report, delete]
  - name: buildId
    displayName: Original producer build ID (0 discovers recent runs)
    type: string
    default: '0'
  - name: profile
    displayName: Approved cleanup profile
    type: string
    default: all
    values: [all, iot-public, iot-fairfax, iot-mooncake, aio-public, aio-fairfax]

jobs:
  - job: Cleanup
    displayName: Report or clean finished owners
    timeoutInMinutes: 60
    cancelTimeoutInMinutes: 5
    pool:
      vmImage: ubuntu-24.04
    steps:
      - checkout: self
        clean: true
        persistCredentials: false
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.13'
      - bash: python -m pip install azure-cli
        displayName: Install cleanup dependencies
      - template: templates/cleanup-profiles.yml
        parameters:
          profile: ${{ parameters.profile }}
          mode: ${{ parameters.mode }}
          buildId: ${{ parameters.buildId }}
      - publish: cleanup-report
        artifact: cleanup-report-$(System.JobAttempt)
        displayName: Retain classification and ownership evidence
        condition: always()

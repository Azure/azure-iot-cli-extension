trigger: none
pr: none
name: iot-integration-$(Date:yyyyMMdd).$(Rev:r)
pool:
  vmImage: ubuntu-24.04

parameters:
  - name: mode
    displayName: Mode
    type: string
    default: Integration tests
    values: [Dry run, Integration tests]
  - name: services
    displayName: Services
    type: stringList
    default: [DPS/Hub/ADR/ADU]
    values: [DPS/Hub/ADR/ADU, DPS, HubControl, HubData, ADU, ADR]
  - name: pythonVersions
    displayName: Python versions
    type: stringList
    default: ['3.13']
    values: ['3.10', '3.11', '3.12', '3.13']
  - name: regions
    displayName: Regions (CSV)
    type: string
    default: australiaeast
  - name: armEndpoint
    displayName: ARM endpoint
    type: string
    default: public
    values: [public, canary]
  - name: releaseBuildId
    displayName: Release build ID
    type: number
    default: 0

extends:
  template: templates/integration-pipeline.yml
  parameters:
    ${{ each pair in parameters }}:
      ${{ if ne(pair.key, 'pythonVersions') }}:
        ${{ pair.key }}: ${{ pair.value }}
    pythonVersions: ${{ join(' ', parameters.pythonVersions) }}

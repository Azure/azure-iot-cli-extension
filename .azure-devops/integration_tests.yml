trigger: none
pr: none
name: integration-$(Date:yyyyMMdd).$(Rev:r)
lockBehavior: sequential

parameters:
  - name: mode
    displayName: Run mode
    type: string
    default: Dry run
    values: [Dry run, Integration tests]
  - name: services
    displayName: Services
    type: stringList
    default: [DPS, HubControl, HubData, ADU, ADR]
    values: [DPS, HubControl, HubData, ADU, ADR]
  - name: pythonVersions
    displayName: Python versions
    type: stringList
    default: ['3.13']
    values: ['3.10', '3.11', '3.12', '3.13']
  - name: regions
    displayName: Azure regions (comma-separated, without spaces)
    type: string
    default: australiaeast
  - name: armEndpoint
    displayName: ARM routing (canary requires centraluseuap)
    type: string
    default: public
    values: [public, canary]

variables:
  - group: aziotcli_test_primary
  - name: endpoint
    ${{ if eq(parameters.armEndpoint, 'public') }}:
      value: https://management.azure.com
    ${{ else }}:
      value: https://centraluseuap.management.azure.com

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Plan
    displayName: Validate execution plan
    jobs:
      - job: Plan
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.13'
          - bash: |
              set -euo pipefail
              python azext_iot/tests/_ado_pipeline.py plan \
                --services $SERVICES --versions $VERSIONS --regions $REGIONS \
                --endpoint "$ENDPOINT" > plan.json
              cat plan.json
            displayName: Validate exact matrix before Azure access
            env:
              SERVICES: ${{ join(' ', parameters.services) }}
              VERSIONS: ${{ join(' ', parameters.pythonVersions) }}
              REGIONS: ${{ replace(parameters.regions, ',', ' ') }}
              ENDPOINT: $(endpoint)
          - publish: plan.json
            artifact: integration-plan-$(System.JobAttempt)

  - ${{ if eq(parameters.mode, 'Integration tests') }}:
      - stage: Build
        displayName: Build candidate wheel
        dependsOn: Plan
        jobs:
          - job: Build
            timeoutInMinutes: 40
            steps:
              - template: templates/setup-python.yml
                parameters:
                  pythonVersion: '3.13'
              - bash: python -m build --wheel
                displayName: Build the immutable test candidate
              - publish: dist
                artifact: integration-wheel-$(System.JobAttempt)

      - stage: Lint
        displayName: Lint
        dependsOn: Plan
        jobs:
          - job: Lint
            timeoutInMinutes: 25
            steps:
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '3.13'
              - bash: |
                  set -euo pipefail
                  python -m pip install tox
                  python -m tox r -e lint -vv
                displayName: Flake8 and pylint

      - stage: Unit
        displayName: Unit tests
        dependsOn: Plan
        jobs:
          - job: Unit
            timeoutInMinutes: 25
            steps:
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '3.13'
              - bash: |
                  set -euo pipefail
                  python -m pip install tox
                  python -m tox r -e clean,python-azcur-unit,report -vv
                displayName: Unit tests and coverage
              - task: PublishTestResults@2
                condition: succeededOrFailed()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: junit/test-iotext-unit.xml
                  failTaskOnFailedTests: true
                  failTaskOnMissingResultsFile: true
              - publish: .coverage
                condition: succeededOrFailed()
                artifact: integration-unit-coverage-$(System.JobAttempt)

      - ${{ each service in parameters.services }}:
          - template: templates/integration-service.yml
            parameters:
              service: ${{ service }}
              pythonVersions: ${{ parameters.pythonVersions }}
              regions: ${{ split(parameters.regions, ',') }}
      - stage: Qualify
        displayName: Verify all expected cases and publish coverage
        dependsOn:
          - Plan
          - Build
          - Lint
          - Unit
          - ${{ each service in parameters.services }}:
              - ${{ service }}
        jobs:
          - job: Gate
            steps:
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '3.13'
              - task: DownloadPipelineArtifact@2
                inputs:
                  buildType: current
                  targetPath: $(Pipeline.Workspace)/qualification
              - bash: |
                  set -euo pipefail
                  python azext_iot/tests/_ado_pipeline.py gate --history "$HISTORY"
                  python -m pip install coverage
                  python azext_iot/tests/_ado_pipeline.py coverage --history "$HISTORY"
                env:
                  HISTORY: $(Pipeline.Workspace)/qualification
              - task: PublishCodeCoverageResults@2
                inputs:
                  summaryFileLocation: coverage.xml
                  failIfCoverageEmpty: true
              - publish: htmlcov
                artifact: integration-coverage-$(System.JobAttempt)

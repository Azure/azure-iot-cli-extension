trigger: none
pr: none
name: integration-$(Date:yyyyMMdd).$(Rev:r)
lockBehavior: sequential
pool:
  vmImage: ubuntu-24.04

parameters:
  - name: mode
    displayName: Run mode
    type: string
    default: Integration tests
    values: [Dry run, Integration tests]
  - name: services
    displayName: Services
    type: stringList
    default: [DPS/Hub/ADR/ADU]
    values: [DPS/Hub/ADR/ADU, DPS, HubControl, HubData, ADU, ADR]
  - name: pythonVersions
    displayName: Python versions
    type: stringList
    default: ['3.13']
    values: ['3.10', '3.11', '3.12', '3.13']
  - name: regions
    displayName: Azure regions (comma-separated, without spaces)
    type: string
    default: australiaeast
  - name: armEndpoint
    displayName: ARM routing (canary requires centraluseuap)
    type: string
    default: public
    values: [public, canary]
  - name: releaseBuildId
    displayName: Release candidate build ID (0 builds from source)
    type: number
    default: 0

extends:
  template: templates/integration-pipeline.yml
  parameters: ${{ parameters }}

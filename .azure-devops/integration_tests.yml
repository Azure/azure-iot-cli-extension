trigger: none
pr: none
name: iot-integration-$(Date:yyyyMMdd).$(Rev:r)
appendCommitMessageToRunName: false
parameters:
  - name: mode
    displayName: Mode
    type: string
    default: Integration tests
    values:
      - Dry run
      - Integration tests
  - name: cloud
    displayName: Cloud
    type: string
    default: Public
    values:
      - Public
      - Fairfax
      - Mooncake
  - name: regions
    displayName: Public region
    type: stringList
    default:
      - Australia East
    values:
      - Australia East
      - Japan East
      - Central US
      - UK South
      - West US
      - West US 3
      - East US
      - West Europe
  - name: services
    displayName: Services
    type: stringList
    default:
      - DPS
      - HubControl
      - HubData
      - ADU
      - ADR
    values:
      - DPS
      - HubControl
      - HubData
      - ADU
      - ADR
  - name: pythonVersions
    displayName: Python
    type: stringList
    default:
      - '3.13'
    values:
      - '3.10'
      - '3.11'
      - '3.12'
      - '3.13'
variables:
  - group: aziotcli_test_primary
  - template: templates/integration-profile.yml
    parameters:
      cloud: ${{ lower(parameters.cloud) }}
      version: ga
      region: ${{ join(',', parameters.regions) }}
      services: ${{ parameters.services }}
  - name: servicesCsv
    value: ${{ join(',', parameters.services) }}
  - name: endpoint
    value: $(TestEndpoint)
  - name: ReleasePipelineId
    value: '161'
pool:
  vmImage: ubuntu-24.04
stages:
  - stage: Plan
    displayName: Plan
    jobs:
      - job: Plan
        steps:
          - task: UsePythonVersion@0
            displayName: Select Python
            inputs:
              versionSpec: '3.13'
          - bash: |
              set -euo pipefail
              python azext_iot/tests/_ado_pipeline.py plan \
                --services $SERVICES --versions $VERSIONS --regions $REGIONS \
                --endpoint "$ENDPOINT" --release-build-id "$RELEASE_BUILD_ID" > plan.json
              cat plan.json
            displayName: Check matrix
            env:
              SERVICES: ${{ replace(variables.servicesCsv, ',', ' ') }}
              VERSIONS: ${{ join(' ', parameters.pythonVersions) }}
              REGIONS: ${{ replace(variables.TestRegion, ',', ' ') }}
              ENDPOINT: $(endpoint)
              RELEASE_BUILD_ID: $(ReleaseCandidateBuildId)
              azext_iot_test_subscription: $(TestSubscription)
              azext_iot_testrg: $(TestResourceGroup)
          - publish: plan.json
            displayName: Publish plan
            artifact: integration-plan-$(System.JobAttempt)
          - bash: python azext_iot/tests/_ado_pipeline.py title --plan "$PLAN" --kind "$RUN_KIND" --mode "$RUN_MODE" --release-build-id
              "$RELEASE_BUILD_ID"
            displayName: Set run title
            env:
              PLAN: plan.json
              RUN_KIND: integration
              RUN_MODE: ${{ parameters.mode }}
              RELEASE_BUILD_ID: $(ReleaseCandidateBuildId)
  - ${{ if eq(parameters.mode, 'Integration tests') }}:
      - stage: Build
        displayName: Build
        dependsOn: Plan
        jobs:
          - job: Build
            timeoutInMinutes: 40
            steps:
              - template: templates/setup-python.yml
                parameters:
                  pythonVersion: '3.13'
                  condition: and(succeeded(), eq(variables['ReleaseCandidateBuildId'], '0'))
              - bash: python -m build --wheel
                displayName: Build wheel
                condition: and(succeeded(), eq(variables['ReleaseCandidateBuildId'], '0'))
              - publish: dist
                displayName: Publish wheel
                artifact: integration-wheel-$(System.JobAttempt)
                condition: and(succeeded(), eq(variables['ReleaseCandidateBuildId'], '0'))
              - task: UsePythonVersion@0
                displayName: Select Python
                inputs:
                  versionSpec: '3.13'
                condition: and(succeeded(), ne(variables['ReleaseCandidateBuildId'], '0'))
              - bash: python azext_iot/tests/_release_candidate.py parent --metadata "$PARENT_METADATA"
                displayName: Check release source
                env:
                  RELEASE_BUILD_ID: $(ReleaseCandidateBuildId)
                  RELEASE_PIPELINE_ID: $(ReleasePipelineId)
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  PARENT_METADATA: $(Agent.TempDirectory)/release-parent-$(System.JobAttempt).json
                condition: and(succeeded(), ne(variables['ReleaseCandidateBuildId'], '0'))
              - task: DownloadPipelineArtifact@2
                displayName: Download artifacts
                inputs:
                  buildType: specific
                  project: $(System.TeamProjectId)
                  definition: $(ReleasePipelineId)
                  buildVersionToDownload: specific
                  pipelineId: $(ReleaseCandidateBuildId)
                  artifactName: release-candidate
                  targetPath: $(Pipeline.Workspace)/release-candidate-$(System.JobAttempt)
                condition: and(succeeded(), ne(variables['ReleaseCandidateBuildId'], '0'))
              - bash: |
                  python azext_iot/tests/_release_candidate.py verify \
                    --metadata "$PARENT_METADATA" --candidate "$CANDIDATE"
                displayName: Check candidate
                env:
                  RELEASE_BUILD_ID: $(ReleaseCandidateBuildId)
                  RELEASE_PIPELINE_ID: $(ReleasePipelineId)
                  PARENT_METADATA: $(Agent.TempDirectory)/release-parent-$(System.JobAttempt).json
                  CANDIDATE: $(Pipeline.Workspace)/release-candidate-$(System.JobAttempt)
                condition: and(succeeded(), ne(variables['ReleaseCandidateBuildId'], '0'))
              - publish: $(Pipeline.Workspace)/release-candidate-$(System.JobAttempt)
                displayName: Publish wheel
                artifact: integration-wheel-$(System.JobAttempt)
                condition: and(succeeded(), ne(variables['ReleaseCandidateBuildId'], '0'))
      - stage: Lint
        displayName: Lint
        dependsOn: Plan
        jobs:
          - job: Lint
            timeoutInMinutes: 25
            steps:
              - task: UsePythonVersion@0
                displayName: Select Python
                inputs:
                  versionSpec: '3.13'
              - bash: |
                  set -euo pipefail
                  python -m pip install tox
                  python -m tox r -e lint -vv
                displayName: Run Lint
      - stage: Unit
        displayName: Unit
        dependsOn: Plan
        jobs:
          - job: Unit
            displayName: Unit
            timeoutInMinutes: 25
            strategy:
              maxParallel: 4
              matrix:
                shard1:
                  shard: 1
                shard2:
                  shard: 2
                shard3:
                  shard: 3
                shard4:
                  shard: 4
            steps:
              - task: UsePythonVersion@0
                displayName: Select Python
                inputs:
                  versionSpec: '3.13'
              - bash: |
                  set -euo pipefail
                  python -m pip install tox
                  python -m tox r -e python-azcur-unit -vv -- \
                    -p azext_iot.tests._unit_shard_plugin --unit-shard "$SHARD" \
                    --unit-shard-output "$RESULTS" --junitxml "$RESULTS/junit.xml"
                displayName: Run unit tests
                env:
                  SHARD: $(shard)
                  UNIT_RUN_ID: $(Build.BuildId)
                  UNIT_COMMIT: $(Build.SourceVersion)
                  UNIT_ATTEMPT: $(System.JobAttempt)
                  RESULTS: $(Build.SourcesDirectory)/unit-result
                  COVERAGE_FILE: $(Build.SourcesDirectory)/unit-result/coverage.dat
              - task: PublishTestResults@2
                displayName: Publish results
                condition: succeededOrFailed()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: unit-result/junit.xml
                  testRunTitle: Unit shard $(shard) attempt $(System.JobAttempt)
                  failTaskOnFailedTests: true
                  failTaskOnMissingResultsFile: true
              - publish: unit-result
                displayName: Publish results
                condition: succeededOrFailed()
                artifact: unit-shard-$(shard)-$(System.JobAttempt)
          - job: UnitGate
            displayName: Unit results
            dependsOn: Unit
            steps:
              - task: UsePythonVersion@0
                displayName: Select Python
                inputs:
                  versionSpec: '3.13'
              - task: DownloadPipelineArtifact@2
                displayName: Download artifacts
                inputs:
                  buildType: current
                  itemPattern: unit-shard-*/**
                  targetPath: $(Pipeline.Workspace)/unit-history
              - bash: |
                  set -euo pipefail
                  python -m pip install coverage
                  python azext_iot/tests/_unit_shards.py \
                    --history "$(Pipeline.Workspace)/unit-history" --output unit-coverage
                displayName: Merge unit results
                env:
                  UNIT_RUN_ID: $(Build.BuildId)
                  UNIT_COMMIT: $(Build.SourceVersion)
              - publish: unit-coverage
                displayName: Publish coverage
                artifact: integration-unit-coverage-$(System.JobAttempt)
      - ${{ if ne(variables.servicesCsv, '') }}:
          - ${{ each service in split(variables.servicesCsv, ',') }}:
              - template: templates/integration-service.yml
                parameters:
                  service: ${{ service }}
                  pythonVersions: ${{ join(' ', parameters.pythonVersions) }}
                  regions: ${{ split(variables.TestRegion, ',') }}
                  subscription: ${{ variables.TestSubscription }}
                  resourceGroup: ${{ variables.TestResourceGroup }}
                  armResource: ${{ variables.TestArmResource }}
                  azureServiceConnection: ${{ variables.TestAzureServiceConnection }}
      - stage: Qualify
        displayName: Results
        dependsOn:
          - Plan
          - Build
          - Lint
          - Unit
          - ${{ if ne(variables.servicesCsv, '') }}:
              - ${{ each service in split(variables.servicesCsv, ',') }}:
                  - ${{ service }}
        jobs:
          - job: Gate
            displayName: Results
            steps:
              - task: UsePythonVersion@0
                displayName: Select Python
                inputs:
                  versionSpec: '3.13'
              - task: DownloadPipelineArtifact@2
                displayName: Download artifacts
                inputs:
                  buildType: current
                  targetPath: $(Pipeline.Workspace)/qualification
              - bash: |
                  set -euo pipefail
                  python azext_iot/tests/_ado_pipeline.py gate --history "$HISTORY"
                  python -m pip install coverage
                  python azext_iot/tests/_ado_pipeline.py coverage --history "$HISTORY"
                displayName: Check results
                env:
                  HISTORY: $(Pipeline.Workspace)/qualification
                  azext_iot_test_subscription: $(TestSubscription)
                  azext_iot_testrg: $(TestResourceGroup)
              - task: PublishCodeCoverageResults@2
                displayName: Publish coverage
                inputs:
                  summaryFileLocation: coverage.xml
                  failIfCoverageEmpty: true
              - publish: htmlcov
                displayName: Publish coverage
                artifact: integration-coverage-$(System.JobAttempt)

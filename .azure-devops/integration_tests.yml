pr: none
trigger: none

parameters:
  - name: variableGroup
    type: string
    default: "aziotcli_test_primary"
  - name: testAgentVmImage
    type: string
    default: "ubuntu-24.04"
    values:
      - "ubuntu-24.04"
      - "ubuntu-latest"
  - name: windowsAgentVmImage
    type: string
    default: "windows-2025"
  - name: pythonVersion
    displayName: "Python version for building wheels, KPIs"
    type: string
    default: "3.13"
    values:
      - "3.10"
      - "3.11"
      - "3.12"
      - "3.13"
  - name: pythonVersionsTestingMatrix
    type: object
    default: >
      {
        Python310:
        {
          python: '3.10'
        },
        Python311:
        {
          python: '3.11'
        },
        Python312:
        {
          python: '3.12'
        },
        Python313:
        {
          python: '3.13'
        }
      }
  - name: stageForPublish
    type: boolean
    default: false
  - name: "testCentral"
    type: boolean
    default: true
  - name: "testADT"
    type: boolean
    default: true
  - name: "testDPS"
    type: boolean
    default: true
  - name: "testHub"
    type: boolean
    default: true
  - name: "testADU"
    type: boolean
    default: true
  - name: "azureCLIVersion"
    type: string
    default: "released"
    values:
      - min
      - released
      - msi
variables:
  - group: ${{ parameters.variableGroup }}

stages:
  - stage: "build"
    displayName: "Build and Publish Artifacts"
    jobs:
      - job: "Build_Publish_Azure_IoT_CLI_Extension"
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: templates/setup-python.yml
            parameters:
              pythonVersion: ${{ parameters.pythonVersion }}
          - template: templates/build-publish-azure-iot-cli-extension.yml

      - job: "Build_Publish_Azure_CLI_Test_SDK"
        pool:
          vmImage: ${{ parameters.testAgentVmImage }}

        steps:
          - template: templates/setup-python.yml
            parameters:
              pythonVersion: ${{ parameters.pythonVersion }}
          - template: templates/build-publish-azure-cli-test-sdk.yml

      - job: "recordVersion"
        displayName: "Install and verify version"
        dependsOn:
          [
            Build_Publish_Azure_IoT_CLI_Extension,
            Build_Publish_Azure_CLI_Test_SDK,
          ]
        steps:
          - template: templates/setup-dev-test-env.yml
            parameters:
              pythonVersion: ${{ parameters.pythonVersion }}

          - template: templates/install-and-record-version.yml

  - stage: "test"
    displayName: "Run tests"
    dependsOn: build
    variables:
      pythonVersions: ${{ parameters.pythonVersionsTestingMatrix }}
    condition: succeeded()
    pool:
      ${{ if eq(parameters.azureCLIVersion, 'msi') }}:
        vmImage: ${{ parameters.windowsAgentVmImage }}
      ${{ else }}:
        vmImage: ${{ parameters.testAgentVmImage }}
    jobs:
      - template: templates/trigger-tests.yml
        parameters:
          azureCLIVersion: ${{ parameters.azureCLIVersion }}
          testADT: ${{ parameters.testADT }}
          testCentral: ${{ parameters.testCentral }}
          testDPS: ${{ parameters.testDPS }}
          testHub: ${{ parameters.testHub }}
          testADU: ${{ parameters.testADU }}
          maxParallelADT: 2
          maxParallelDPS: 2
          maxParallelHub: 2
          maxParallelADU: 4
      - job: "evaluateCmdTable"
        displayName: "Evaluate Command Table"
        pool:
          vmImage: ${{ parameters.testAgentVmImage }}
        steps:
          - template: templates/evaluate-command-table.yml
  - stage: "smokeTest"
    displayName: "Run smoke tests"
    dependsOn: test
    variables:
      pythonVersions: ${{ parameters.pythonVersionsTestingMatrix }}
    condition: succeeded()
    pool:
      ${{ if eq(parameters.azureCLIVersion, 'msi') }}:
        vmImage: ${{ parameters.windowsAgentVmImage }}
      ${{ else }}:
        vmImage: ${{ parameters.testAgentVmImage }}
    jobs:
      - template: templates/smoke-tests.yml
        parameters:
          azureCLIVersion: ${{ parameters.azureCLIVersion }}

  - stage: "kpi"
    displayName: "Build KPIs"
    dependsOn: [build, test]
    jobs:
      - job: "calculateCodeCoverage"
        displayName: "Calculate distributed code coverage"
        steps:
          - template: templates/calculate-code-coverage.yml
            parameters:
              pythonVersion: ${{ parameters.pythonVersion }}

trigger: none
pr: none
schedules: []
name: iot-health-$(MonitorCloud)-$(MonitorTrack)-$(Date:yyyyMMdd).$(Rev:r)
appendCommitMessageToRunName: false

parameters:
  - name: runIntegration
    displayName: Run approved live integration tests
    type: boolean
    default: false

pool:
  vmImage: ubuntu-24.04

variables:
  endpoint: $(MonitorEndpoint)

stages:
  - stage: Prepare
    displayName: Prepare released version
    jobs:
      - job: Acquire
        timeoutInMinutes: 30
        steps:
          - checkout: self
            clean: true
            persistCredentials: false
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.13'
          - bash: python -m pip install packaging
            displayName: Install resolver dependencies
          - task: DownloadPipelineArtifact@2
            displayName: Restore frozen release on retry
            condition: gt(variables['System.JobAttempt'], 1)
            inputs:
              buildType: current
              itemPattern: release-selection-*/manifest.json
              targetPath: $(Pipeline.Workspace)/release-history
          - bash: |
              set -euo pipefail
              python scripts/release_monitor.py resolve \
                --configuration .azure-devops/release-monitors.json \
                --extension azure-iot --cloud "$CLOUD" --track "$TRACK" \
                --automation-commit "$BUILD_SOURCEVERSION" --attempt "$SYSTEM_JOBATTEMPT" \
                --history "$HISTORY" --output manifest.json
            displayName: Resolve or restore the immutable release selection
            env:
              CLOUD: $(MonitorCloud)
              TRACK: $(MonitorTrack)
              HISTORY: $(Pipeline.Workspace)/release-history
          - publish: manifest.json
            artifact: release-selection-$(System.JobAttempt)
            displayName: Freeze selection before acquisition
          - bash: |
              set -euo pipefail
              python scripts/release_monitor.py acquire --manifest manifest.json --output "$BUNDLE"
              echo "##vso[task.setvariable variable=artifact;isOutput=true]release-bundle-$SYSTEM_JOBATTEMPT"
            name: bundle
            displayName: Acquire immutable published wheel and tests
            env:
              BUNDLE: $(Pipeline.Workspace)/release-bundle
          - ${{ if parameters.runIntegration }}:
              - bash: |
                  set -euo pipefail
                  python scripts/release_monitor_adapter.py plan --bundle "$BUNDLE" --output "$SOURCE"
                  mkdir -p wheel
                  cp "$BUNDLE"/*.whl wheel/
                displayName: Validate released integration cohorts
                env:
                  BUNDLE: $(Pipeline.Workspace)/release-bundle
                  SOURCE: $(Agent.TempDirectory)/iot-monitor-source
                  MONITOR_CLOUD: $(MonitorCloud)
                  MONITOR_TRACK: $(MonitorTrack)
                  MONITOR_SERVICES: $(MonitorServices)
                  MONITOR_REGION: $(MonitorRegion)
                  MONITOR_ENDPOINT: $(MonitorEndpoint)
                  azext_iot_test_subscription: $(MonitorSubscription)
                  azext_iot_testrg: $(MonitorResourceGroup)
              - publish: wheel
                artifact: integration-wheel-$(System.JobAttempt)
                displayName: Publish acquired wheel
              - publish: $(Pipeline.Workspace)/release-bundle/plan.json
                artifact: integration-plan-$(System.JobAttempt)
                displayName: Publish integration plan
          - publish: $(Pipeline.Workspace)/release-bundle
            artifact: release-bundle-$(System.JobAttempt)
            displayName: Publish frozen release bundle

  - ${{ if not(parameters.runIntegration) }}:
      - stage: ActivationRequired
        displayName: Live monitoring is not activated
        dependsOn: Prepare
        jobs:
          - job: NotQualified
            steps:
              - checkout: none
              - bash: |
                  echo "##vso[task.logissue type=error]Preparation only. No integration tests ran. Keep this definition disabled until identity, scope, capacity, and live execution are approved."
                  exit 1
                displayName: Do not report preparation as healthy monitoring

  - ${{ if parameters.runIntegration }}:
      - ${{ each service in split('DPS,HubControl,HubData,ADU,ADR', ',') }}:
          - template: templates/integration-service.yml
            parameters:
              monitor: true
              service: ${{ service }}
              pythonVersions: '3.13'
              regions: []
              subscription: $(MonitorSubscription)
              resourceGroup: $(MonitorResourceGroup)
              armResource: $(MonitorArmResource)
      - stage: Results
        displayName: Verify released-version results
        condition: always()
        dependsOn: [Prepare, DPS, HubControl, HubData, ADU, ADR]
        variables:
          monitorBundle: $[ stageDependencies.Prepare.Acquire.outputs['bundle.artifact'] ]
        jobs:
          - job: Verify
            steps:
              - checkout: self
                clean: true
                persistCredentials: false
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '3.13'
              - task: DownloadPipelineArtifact@2
                inputs:
                  buildType: current
                  targetPath: $(Pipeline.Workspace)/history
                  itemPattern: |
                    integration-wheel-*/**
                    integration-plan-*/**
                    attempt-*/**
              - task: DownloadPipelineArtifact@2
                displayName: Download released source separately from attempt evidence
                inputs:
                  buildType: current
                  artifactName: $(monitorBundle)
                  targetPath: $(Pipeline.Workspace)/release-bundle
              - bash: |
                  set -euo pipefail
                  python -m pip install packaging
                  python scripts/release_monitor_adapter.py stage --bundle "$BUNDLE" --output "$SOURCE"
                  cd "$SOURCE"
                  python azext_iot/tests/_ado_pipeline.py gate --history "$HISTORY"
                displayName: Require every selected released cohort and cleanup
                env:
                  BUNDLE: $(Pipeline.Workspace)/release-bundle
                  SOURCE: $(Agent.TempDirectory)/iot-monitor-source
                  HISTORY: $(Pipeline.Workspace)/history
                  MONITOR_CLOUD: $(MonitorCloud)
                  MONITOR_TRACK: $(MonitorTrack)
                  AZEXT_IOT_MONITOR_MANIFEST: $(Agent.TempDirectory)/iot-monitor-source/release-monitor.json
                  azext_iot_test_subscription: $(MonitorSubscription)
                  azext_iot_testrg: $(MonitorResourceGroup)

trigger: none
pr: none
schedules: []
name: iot-access-smoke-$(MonitorCloud)-$(MonitorTrack)-$(Build.BuildId)
appendCommitMessageToRunName: false

parameters:
  - name: sourceBranch
    type: string
    default: dev

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Prepare
    jobs:
      - job: Candidate
        timeoutInMinutes: 25
        steps:
          - checkout: self
            clean: true
            persistCredentials: false
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.13'
          - bash: |
              set -euo pipefail
              python -m pip install packaging build
              python scripts/release_monitor.py resolve-source \
                --configuration .azure-devops/release-monitors.json \
                --cloud "$MONITORCLOUD" --track "$MONITORTRACK" --source-branch "$SOURCE_BRANCH" \
                --automation-commit "$BUILD_SOURCEVERSION" --attempt "$SYSTEM_JOBATTEMPT" --output manifest.json
              echo "##vso[build.updatebuildnumber]iot-access-smoke-$MONITORCLOUD-$MONITORTRACK-b$BUILD_BUILDID"
              python scripts/release_monitor.py acquire-source --manifest manifest.json --output "$BUNDLE"
              python scripts/release_monitor.py build-source --output "$BUNDLE"
            displayName: Freeze and build the selected source for access-only smoke
            env:
              SOURCE_BRANCH: ${{ parameters.sourceBranch }}
              BUNDLE: $(Pipeline.Workspace)/smoke-bundle
          - publish: $(Pipeline.Workspace)/smoke-bundle
            artifact: access-smoke-bundle
  - stage: Access
    dependsOn: Prepare
    jobs:
      - ${{ each service in split('DPS,HubControl,HubData,ADU,ADR', ',') }}:
          - job: ${{ service }}
            condition: and(succeeded(), contains(variables['MonitorServices'], '${{ service }}'))
            timeoutInMinutes: 20
            cancelTimeoutInMinutes: 5
            steps:
              - checkout: self
                clean: true
                persistCredentials: false
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '3.13'
              - download: current
                artifact: access-smoke-bundle
              - bash: python -m pip install packaging
              - task: AzureCLI@2
                displayName: Check cloud authentication and service access
                inputs:
                  azureSubscription: $(AzureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: python scripts/health_access_smoke.py
                env:
                  SMOKE_SERVICE: ${{ service }}
                  SMOKE_BUNDLE: $(Pipeline.Workspace)/access-smoke-bundle
                  SMOKE_OUTPUT: $(Agent.TempDirectory)/access-smoke
                  MONITOR_CLOUD: $(MonitorCloud)
                  MONITOR_TRACK: $(MonitorTrack)
                  MONITOR_SUBSCRIPTION: $(MonitorSubscription)
                  MONITOR_RESOURCE_GROUP: $(MonitorResourceGroup)
                  MONITOR_ENDPOINT: $(MonitorEndpoint)
                  AZURE_EXTENSION_DIR: $(Agent.TempDirectory)/smoke-extensions
                  AZURE_EXTENSION_USE_DYNAMIC_INSTALL: 'no'
              - publish: $(Agent.TempDirectory)/access-smoke
                artifact: access-smoke-${{ service }}
                condition: succeededOrFailed()
  - stage: NotQualified
    dependsOn: [Prepare, Access]
    condition: always()
    jobs:
      - job: Explain
        steps:
          - checkout: none
          - bash: |
              echo "##vso[task.logissue type=error]Access-only smoke, not full release-health qualification. Inspect individual service checks."
              exit 1

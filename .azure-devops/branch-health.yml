trigger: none
pr: none
schedules:
  - cron: "30 0 * * *"
    displayName: "Public GA branch health (182, 00:30 UTC)"
    branches:
      include: [dev]
    always: true
name: iot-$(Build.BuildId)
appendCommitMessageToRunName: false
parameters:
  - name: mode
    type: string
    default: Integration tests
    values: [Dry run, Integration tests]
pool:
  vmImage: ubuntu-24.04
variables:
  - template: templates/integration-profile.yml
    parameters:
      cloud: public
      version: ga
      region: Australia East
      services: [DPS, HubControl, HubData, ADU, ADR]
  - name: TestMode
    value: ${{ parameters.mode }}
  - name: TestPythons
    value: '3.13'
  - name: endpoint
    value: $(TestEndpoint)
stages:
  - template: templates/health-stages.yml
    parameters:
      source: true
      mode: ${{ parameters.mode }}
      pythonVersions: '3.13'
      regions: ${{ variables.TestRegion }}

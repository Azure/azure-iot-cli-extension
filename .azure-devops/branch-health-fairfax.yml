trigger: none
pr: none
# Held pending sovereign policy/authorization: 184 at 01:00 UTC, cron "0 1 * * *", dev only.
schedules: []
name: iot-branch-fairfax-ga-$(Date:yyyyMMdd).$(Rev:r)
appendCommitMessageToRunName: false
parameters:
  - name: mode
    type: string
    default: Integration tests
    values: [Dry run, Integration tests]
pool:
  vmImage: ubuntu-24.04
variables:
  - template: templates/integration-profile.yml
    parameters:
      cloud: fairfax
      version: ga
      region: Australia East
      services: [DPS, HubControl, HubData]
  - name: TestMode
    value: ${{ parameters.mode }}
  - name: TestPythons
    value: '3.13'
  - name: endpoint
    value: $(TestEndpoint)
stages:
  - template: templates/health-stages.yml
    parameters:
      source: true
      mode: ${{ parameters.mode }}
      pythonVersions: '3.13'
      regions: ${{ variables.TestRegion }}

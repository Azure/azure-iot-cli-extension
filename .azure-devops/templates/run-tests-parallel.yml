parameters:
  - name: pythonVersion
    type: string
    default: "3.13"
  - name: runUnitTests
    type: boolean
    default: false
  - name: runIntTests
    type: boolean
    default: true
  - name: azureCLIVersion
    type: string
    default: released
    values:
      - min
      - released
      - msi
  - name: path
    type: string
    default: "azext_iot/tests"
  - name: name
    type: string
    default: "all"
  - name: serviceConnection
    type: string
    default: ""
  - name: hubSuite
    type: string
    # ADO allowed values cannot be empty; sentinel means no owned Hub suite.
    default: "sentinel"
    values: ["sentinel", "HubControl", "HubData"]
  - name: hubSubscription
    type: string
    default: ""
  - name: hubResourceGroup
    type: string
    default: cli-int-test-rg
  - name: hubRegion
    type: string
    default: centraluseuap
  - name: num_threads
    type: number
    default: 6
  - name: num_reruns
    type: number
    default: 2
  - name: reruns_delay
    type: number
    default: 60
  - name: parallel_execution_dirs
    type: object
    default:
      - "azext_iot/tests/digitaltwins"
      - "azext_iot/tests/deviceupdate"

steps:
  - checkout: self
    displayName: "Checkout repository and submodules needed for tests"
    submodules: true

  - template: setup-dev-test-env.yml
    parameters:
      pythonVersion: ${{ parameters.pythonVersion }}
      azureCLIVersion: ${{ parameters.azureCLIVersion }}

  # Owned Hub phases must never inherit the legacy pinned-resource pytest.ini.
  - ${{ if eq(parameters.hubSuite, 'sentinel') }}:
      - template: set-testenv-sentinel.yml

  - ${{ if ne(parameters.hubSuite, 'sentinel') }}:
      - task: PythonScript@0
        displayName: "Validate owned Hub scope and platform before Azure login"
        inputs:
          scriptSource: inline
          script: |
            import os
            import runpy
            import sys
            from pathlib import Path
            if sys.platform != "linux":
                raise SystemExit("Hub live phases are unsupported on Windows; this job cannot qualify Hub coverage.")
            scope = (os.environ["azext_iot_hub_subscription"], os.environ["azext_iot_testrg"],
                     os.environ["azext_iot_testhub_location"])
            if scope != ("a386d5ea-ea90-441a-8263-d816368c84a1", "cli-int-test-rg", "centraluseuap"):
                raise SystemExit("Hub live phases require the authorized subscription, resource group and canary region.")
            environment = runpy.run_path("azext_iot/tests/_hub_phase_runner.py")["environment"]
            environment(dict(os.environ), "${{ parameters.hubSuite }}", "preflight",
                        Path("test-result/hub-phases"), "preflight", scope[0], scope[1])
        env:
          azext_iot_hub_subscription: ${{ parameters.hubSubscription }}
          azext_iot_testrg: ${{ parameters.hubResourceGroup }}
          azext_iot_testhub_location: ${{ parameters.hubRegion }}

  # Fix for DNS resolution issues: https://github.com/actions/virtual-environments/issues/798
  - script: |
      sudo ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
    displayName: Bypass local DNS server to workaround issue resolving ADT hostnames
    condition: and(succeededOrFailed(), eq( variables['Agent.OS'], 'Linux' ))

  - ${{ if eq(parameters.runUnitTests, 'true') }}:
      - script: |
          pytest -vv ${{ parameters.path }} -k "_unit.py" --cov=azext_iot --cov-config .coveragerc --junitxml=junit/test-iotext-unit-${{ parameters.name }}.xml
        displayName: "${{ parameters.name }} unit tests"
        env:
          COVERAGE_FILE: .coverage.${{ parameters.name }}

  - ${{ if eq(parameters.runIntTests, 'true') }}:
      - task: AzureCLI@2
        ${{ if ne(parameters.hubSuite, 'sentinel') }}:
          continueOnError: false
          env:
            azext_iot_hub_subscription: ${{ parameters.hubSubscription }}
            azext_iot_testrg: ${{ parameters.hubResourceGroup }}
            azext_iot_testhub_location: ${{ parameters.hubRegion }}
        ${{ else }}:
          continueOnError: true
        displayName: "${{ parameters.name }} integration tests"
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          ${{ if containsValue(parameters.parallel_execution_dirs, parameters.path) }}:
            inlineScript: |
              export COVERAGE_FILE=.coverage.${{ parameters.name }}
              pytest -vv ${{ parameters.path }} -k "_int.py" --dist=loadfile -n ${{ parameters.num_threads }} --reruns ${{ parameters.num_reruns }} --reruns-delay ${{ parameters.reruns_delay }} --cov=azext_iot --cov-config .coveragerc --junitxml=junit/test-iotext-int.xml --durations=0
          # remove parallelization from central tests
          ${{ if contains(parameters.path, 'azext_iot/tests/central') }}:
            inlineScript: |
              export COVERAGE_FILE=.coverage.${{ parameters.name }}
              pytest -vv ${{ parameters.path }} -k "_int.py" --cov=azext_iot --cov-config .coveragerc --junitxml=junit/test-iotext-int.xml
          ${{ if ne(parameters.hubSuite, 'sentinel') }}:
            inlineScript: |
              set -euo pipefail
              export COVERAGE_FILE=.coverage.${{ parameters.name }}
              subscription=$(az account show --query id -o tsv)
              if [ "$subscription" != "$azext_iot_hub_subscription" ]; then
                echo "Hub service connection subscription does not match the authorized scope." >&2
                exit 2
              fi
              python -m azext_iot.tests._hub_phase_runner --suite "${{ parameters.hubSuite }}" \
                --subscription "$azext_iot_hub_subscription" --resource-group "$azext_iot_testrg" \
                --region "$azext_iot_testhub_location" --output test-result/hub-phases
          ${{ if contains(parameters.path, 'azext_iot/tests/dps') }}:
            inlineScript: |
              set -e
              export COVERAGE_FILE=.coverage.${{ parameters.name }}
              # This legacy service-connection/pinned-resource template also supports Windows
              # and parallel matrix jobs; it does not supply the isolated controller's scope.
              if [ -n "${azext_iot_dps_test_phase:-}${azext_iot_dps_phase_receipts:-}${azext_iot_dps_run_uid:-}${azext_iot_dps_test_subscription:-}${azext_iot_dps_test_resource_group:-}" ]; then
                echo "Legacy Azure DevOps DPS coverage rejects isolated phase overrides; use the GitHub DPS controller with explicit scope." >&2
                exit 2
              fi
              echo "DPS coverage: legacy partial regular only, not full qualification. Owned CSR issuance, service-SAS and local-auth-toggle coverage require the GitHub DPS controller."
              pytest -vv ${{ parameters.path }} -k "_int.py and not test_register_and_issue_certificate_contract" --ignore=azext_iot/tests/dps/core/test_dps_disable_local_auth_int.py --dist=loadfile -n ${{ parameters.num_threads }} --reruns ${{ parameters.num_reruns }} --reruns-delay ${{ parameters.reruns_delay }} --cov=azext_iot --cov-config .coveragerc --junitxml=junit/test-iotext-int.xml --durations=0
          ${{ if contains(parameters.path, 'azext_iot/tests/adr') }}:
            inlineScript: |
              export COVERAGE_FILE=.coverage.${{ parameters.name }}
              pytest -vv ${{ parameters.path }} -k "_int.py" --dist=loadfile -n ${{ parameters.num_threads }} --reruns ${{ parameters.num_reruns }} --reruns-delay ${{ parameters.reruns_delay }} --cov=azext_iot --cov-config .coveragerc --junitxml=junit/test-iotext-int.xml --durations=0
  - ${{ if ne(parameters.hubSuite, 'sentinel') }}:
      - task: PublishBuildArtifacts@1
        condition: succeededOrFailed()
        displayName: "Publish Hub phase evidence and redacted logs"
        inputs:
          pathToPublish: test-result/
          publishLocation: "Container"
          artifactName: "hub-phases-${{ parameters.hubSuite }}-py${{ parameters.pythonVersion }}-$(Agent.OS)"

      - task: PublishBuildArtifacts@1
        condition: succeededOrFailed()
        inputs:
          pathToPublish: .coverage.${{ parameters.name }}
          publishLocation: "Container"
          artifactName: "coverage"

      - task: PublishTestResults@2
        condition: succeededOrFailed()
        displayName: "Publish sanitized Hub phase results"
        inputs:
          testResultsFormat: "JUnit"
          testResultsFiles: "test-result/hub-phases/**/junit.xml"
          testRunTitle: "${{ parameters.hubSuite }} Python ${{ parameters.pythonVersion }}"
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
          searchFolder: "$(System.DefaultWorkingDirectory)"

  - ${{ if eq(parameters.hubSuite, 'sentinel') }}:
      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: .coverage.${{ parameters.name }}
          publishLocation: "Container"
          artifactName: "coverage"

      - task: PublishTestResults@2
        condition: succeededOrFailed()
        displayName: "Publish Test Results"
        inputs:
          testResultsFormat: "JUnit"
          testResultsFiles: "**/test-*.xml"
          testRunTitle: "Publish ${{ parameters.name }} test results for Python ${{ parameters.pythonVersion }} on OS $(Agent.OS)"
          searchFolder: "$(System.DefaultWorkingDirectory)"

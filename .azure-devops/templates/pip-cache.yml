parameters:
  - name: pythonVersion
    type: string
    default: '3.13'

steps:
  - task: Cache@2
    displayName: Restore pip downloads (compare restore/save time with install savings)
    inputs:
      key: '"iot-unit-pip-v1" | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | "${{ parameters.pythonVersion }}" | dev_requirements | setup.py | tox.ini'
      path: $(Pipeline.Workspace)/pip-cache
      cacheHitVar: IOT_PIP_CACHE_HIT
  - bash: |
      set -euo pipefail
      echo "Pip cache hit: $CACHE_HIT"
      python -m pip cache info
    displayName: Record pip cache hit and size
    env:
      CACHE_HIT: $(IOT_PIP_CACHE_HIT)
      PIP_CACHE_DIR: $(Pipeline.Workspace)/pip-cache

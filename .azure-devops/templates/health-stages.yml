parameters:
  - name: source
    type: boolean
    default: false
  - name: mode
    type: string
  - name: pythonVersions
    type: string
  - name: regions
    type: string
stages:
  - stage: Prepare
    displayName: Freeze monitored CLI
    jobs:
      - job: Acquire
        timeoutInMinutes: 30
        variables:
          ${{ if parameters.source }}:
            selectionPrefix: source-selection
            healthConfiguration: branch-health.json
            resolveOperation: resolve-source
            acquireOperation: acquire-source
          ${{ else }}:
            selectionPrefix: release-selection
            healthConfiguration: release-monitors.json
            resolveOperation: resolve
            acquireOperation: acquire
        steps:
          - checkout: self
            clean: true
            persistCredentials: false
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.13'
          - bash: python -m pip install packaging
            displayName: Install resolver dependencies
          - task: DownloadPipelineArtifact@2
            displayName: Restore immutable selection on retry
            condition: gt(variables['System.JobAttempt'], 1)
            inputs:
              buildType: current
              itemPattern: $(selectionPrefix)-*/manifest.json
              targetPath: $(Pipeline.Workspace)/source-history
          - bash: |
              set -euo pipefail
              arguments=()
              if [ "$OPERATION" = resolve ]; then arguments+=(--extension azure-iot); fi
              python scripts/release_monitor.py "$OPERATION" \
                --configuration ".azure-devops/$CONFIGURATION" \
                --cloud "$CLOUD" --track "$TRACK" "${arguments[@]}" \
                --automation-commit "$BUILD_SOURCEVERSION" --attempt "$SYSTEM_JOBATTEMPT" \
                --history "$HISTORY" --output manifest.json
            name: source
            displayName: Pin the selected source or published release
            env:
              CLOUD: $(TestCloud)
              TRACK: $(TestTrack)
              OPERATION: $(resolveOperation)
              CONFIGURATION: $(healthConfiguration)
              HISTORY: $(Pipeline.Workspace)/source-history
          - publish: manifest.json
            artifact: $(selectionPrefix)-$(System.JobAttempt)
            displayName: Freeze selection before acquisition
          - bash: |
              set -euo pipefail
              python scripts/release_monitor.py "$OPERATION" --manifest manifest.json --output "$BUNDLE"
              echo "##vso[task.setvariable variable=artifact;isOutput=true]source-bundle-$SYSTEM_JOBATTEMPT"
            name: bundle
            displayName: Acquire the pinned source and tests
            env:
              BUNDLE: $(Pipeline.Workspace)/source-bundle
              OPERATION: $(acquireOperation)
          - bash: |
              set -euo pipefail
              python scripts/release_monitor_adapter.py plan --bundle "$BUNDLE" --output "$SOURCE"
            displayName: Validate selected source integration cohorts
            env:
              BUNDLE: $(Pipeline.Workspace)/source-bundle
              SOURCE: $(Agent.TempDirectory)/iot-monitor-source
              MONITOR_CLOUD: $(TestCloud)
              MONITOR_TRACK: $(TestTrack)
              MONITOR_SERVICES: $(TestServices)
              MONITOR_REGION: $(TestRegion)
              MONITOR_ENDPOINT: $(TestEndpoint)
              azext_iot_test_subscription: $(TestSubscription)
              azext_iot_testrg: $(TestResourceGroup)
              MONITOR_PYTHONS: $(TestPythons)
          - publish: $(Pipeline.Workspace)/source-bundle/plan.json
            artifact: integration-plan-$(System.JobAttempt)
            displayName: Publish integration plan
          - publish: $(Pipeline.Workspace)/source-bundle
            artifact: source-bundle-$(System.JobAttempt)
            displayName: Publish frozen source bundle
  - ${{ if eq(parameters.mode, 'Integration tests') }}:
      - stage: Build
        displayName: Prepare immutable wheel
        dependsOn: Prepare
        variables:
          sourceBundle: $[ stageDependencies.Prepare.Acquire.outputs['bundle.artifact'] ]
        jobs:
          - job: Build
            timeoutInMinutes: 40
            steps:
              - template: source-health-setup.yml
              - task: DownloadPipelineArtifact@2
                displayName: Restore previously built wheel on retry
                condition: and(succeeded(), gt(variables['System.JobAttempt'], 1))
                inputs:
                  buildType: current
                  itemPattern: |
                    health-bundle-*/manifest.json
                    health-bundle-*/*.whl
                  targetPath: $(Pipeline.Workspace)/wheel-history
              - bash: |
                  set -euo pipefail
                  if [ "${SOURCE_BUILD,,}" = true ]; then
                    python -m pip install build
                    python scripts/release_monitor.py build-source --output "$BUNDLE" --history "$HISTORY"
                  fi
                  mkdir -p wheel
                  cp "$BUNDLE"/*.whl wheel/
                  echo "##vso[task.setvariable variable=artifact;isOutput=true]health-bundle-$SYSTEM_JOBATTEMPT"
                name: bundle
                displayName: Build and verify the selected CLI wheel
                env:
                  BUNDLE: $(Pipeline.Workspace)/source-bundle
                  SOURCE_BUILD: ${{ parameters.source }}
                  HISTORY: $(Pipeline.Workspace)/wheel-history
              - publish: wheel
                artifact: integration-wheel-$(System.JobAttempt)
              - publish: $(Pipeline.Workspace)/source-bundle
                artifact: health-bundle-$(System.JobAttempt)
      - stage: Lint
        dependsOn: Prepare
        condition: and(succeeded(), ${{ parameters.source }})
        variables:
          sourceBundle: $[ stageDependencies.Prepare.Acquire.outputs['bundle.artifact'] ]
        jobs:
          - job: Lint
            timeoutInMinutes: 25
            steps:
              - template: source-health-setup.yml
              - bash: |
                  set -euo pipefail
                  python -m pip install tox
                  python -m tox r -e lint -vv
                displayName: Lint selected source
                workingDirectory: $(Agent.TempDirectory)/iot-monitor-source
      - stage: Unit
        dependsOn: Prepare
        condition: and(succeeded(), ${{ parameters.source }})
        variables:
          sourceBundle: $[ stageDependencies.Prepare.Acquire.outputs['bundle.artifact'] ]
          sourceCommit: $[ stageDependencies.Prepare.Acquire.outputs['source.commit'] ]
        jobs:
          - job: Unit
            timeoutInMinutes: 25
            strategy:
              maxParallel: 4
              matrix:
                shard1:
                  shard: 1
                shard2:
                  shard: 2
                shard3:
                  shard: 3
                shard4:
                  shard: 4
            steps:
              - template: source-health-setup.yml
              - bash: |
                  set -euo pipefail
                  python -m pip install tox
                  python -m tox r -e python-azcur-unit -vv -- \
                    -p azext_iot.tests._unit_shard_plugin --unit-shard "$SHARD" \
                    --unit-shard-output "$RESULTS" --junitxml "$RESULTS/junit.xml"
                displayName: Test selected source
                workingDirectory: $(Agent.TempDirectory)/iot-monitor-source
                env:
                  SHARD: $(shard)
                  UNIT_RUN_ID: $(Build.BuildId)
                  UNIT_COMMIT: $(sourceCommit)
                  UNIT_ATTEMPT: $(System.JobAttempt)
                  RESULTS: $(Agent.TempDirectory)/iot-monitor-source/unit-result
                  COVERAGE_FILE: $(Agent.TempDirectory)/iot-monitor-source/unit-result/coverage.dat
              - task: PublishTestResults@2
                condition: succeededOrFailed()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: $(Agent.TempDirectory)/iot-monitor-source/unit-result/junit.xml
                  testRunTitle: Source health unit shard $(shard) attempt $(System.JobAttempt)
                  failTaskOnFailedTests: true
                  failTaskOnMissingResultsFile: true
              - publish: $(Agent.TempDirectory)/iot-monitor-source/unit-result
                condition: succeededOrFailed()
                artifact: unit-shard-$(shard)-$(System.JobAttempt)
          - job: UnitGate
            dependsOn: Unit
            steps:
              - template: source-health-setup.yml
              - task: DownloadPipelineArtifact@2
                inputs:
                  buildType: current
                  itemPattern: unit-shard-*/**
                  targetPath: $(Pipeline.Workspace)/unit-history
              - bash: |
                  set -euo pipefail
                  python -m pip install coverage
                  python azext_iot/tests/_unit_shards.py --history "$HISTORY" --output unit-coverage
                displayName: Require every selected-source unit shard
                workingDirectory: $(Agent.TempDirectory)/iot-monitor-source
                env:
                  HISTORY: $(Pipeline.Workspace)/unit-history
                  UNIT_RUN_ID: $(Build.BuildId)
                  UNIT_COMMIT: $(sourceCommit)
              - publish: $(Agent.TempDirectory)/iot-monitor-source/unit-coverage
                artifact: integration-unit-coverage-$(System.JobAttempt)
      - ${{ each service in split('DPS,HubControl,HubData,ADU,ADR', ',') }}:
          - template: integration-service.yml
            parameters:
              monitor: true
              sourceChecks: ${{ parameters.source }}
              service: ${{ service }}
              pythonVersions: ${{ parameters.pythonVersions }}
              regions: ${{ split(parameters.regions, ',') }}
              subscription: $(TestSubscription)
              resourceGroup: $(TestResourceGroup)
              armResource: $(TestArmResource)
              azureServiceConnection: $(TestAzureServiceConnection)
      - stage: Results
        displayName: Verify monitored CLI results
        condition: always()
        dependsOn:
          - Prepare
          - Build
          - Lint
          - Unit
          - DPS
          - HubControl
          - HubData
          - ADU
          - ADR
        variables:
          monitorBundle: $[ stageDependencies.Build.Build.outputs['bundle.artifact'] ]
        jobs:
          - job: Verify
            steps:
              - checkout: self
                clean: true
                persistCredentials: false
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '3.13'
              - task: DownloadPipelineArtifact@2
                inputs:
                  buildType: current
                  targetPath: $(Pipeline.Workspace)/history
                  itemPattern: |
                    integration-wheel-*/**
                    integration-plan-*/**
                    attempt-*/**
              - task: DownloadPipelineArtifact@2
                displayName: Download built source separately from attempt evidence
                inputs:
                  buildType: current
                  artifactName: $(monitorBundle)
                  targetPath: $(Pipeline.Workspace)/release-bundle
              - bash: |
                  set -euo pipefail
                  python -m pip install packaging
                  python scripts/release_monitor_adapter.py stage --bundle "$BUNDLE" --output "$SOURCE"
                  cd "$SOURCE"
                  python azext_iot/tests/_ado_pipeline.py gate --history "$HISTORY"
                displayName: Require every selected source cohort and cleanup
                env:
                  BUNDLE: $(Pipeline.Workspace)/release-bundle
                  SOURCE: $(Agent.TempDirectory)/iot-monitor-source
                  HISTORY: $(Pipeline.Workspace)/history
                  MONITOR_CLOUD: $(TestCloud)
                  MONITOR_TRACK: $(TestTrack)
                  AZEXT_IOT_MONITOR_MANIFEST: $(Agent.TempDirectory)/iot-monitor-source/release-monitor.json
                  azext_iot_test_subscription: $(TestSubscription)
                  azext_iot_testrg: $(TestResourceGroup)

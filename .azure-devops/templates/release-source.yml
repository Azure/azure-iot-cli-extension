parameters:
  - name: sourceBranch
    type: string

steps:
  - checkout: self
    displayName: Checkout source
    clean: true
    persistCredentials: false
  - task: UsePythonVersion@0
    displayName: Select Python
    inputs:
      versionSpec: "3.13"
      disableDownloadFromRegistry: true
  - script: python scripts/release_pipeline.py checkout --source "$(Agent.TempDirectory)/release-source"
    displayName: Checkout candidate
    env:
      RELEASE_SOURCE_BRANCH: ${{ parameters.sourceBranch }}
      RELEASE_SOURCE_COMMIT: $(sourceCommit)

parameters:
  - name: azureCLIVersion
    type: string
    default: released
    values:
      - min
      - released
      - msi
  - name: "testCentral"
    type: boolean
    default: true
  - name: "testADT"
    type: boolean
    default: true
  - name: "testDPS"
    type: boolean
    default: true
  - name: "testHub"
    type: boolean
    default: true
  - name: "testADU"
    type: boolean
    default: true
  - name: "testADR"
    type: boolean
    default: true
  - name: "maxParallelCentral"
    type: number
    default: 1
  - name: "maxParallelADT"
    type: number
    default: 1
  - name: "maxParallelDPS"
    type: number
    default: 1
  - name: hubSubscription
    type: string
    default: a386d5ea-ea90-441a-8263-d816368c84a1
  - name: hubResourceGroup
    type: string
    default: cli-int-test-rg
  - name: hubRegion
    type: string
    default: centraluseuap
  - name: "maxParallelADU"
    type: number
    default: 1
  - name: "maxParallelADR"
    type: number
    default: 1
  - name: "maxParallelUnit"
    type: number
    default: 1

jobs:
  - job: "testCentral"
    timeoutInMinutes: 90
    displayName: "Test IoT Central"
    condition: and(succeeded(), eq('${{ parameters.testCentral }}', true))
    strategy:
      matrix: $[ variables['pythonVersions'] ]
      maxParallel: ${{ parameters.maxParallelCentral }}
    steps:
      - template: run-tests-parallel.yml
        parameters:
          path: "azext_iot/tests/central"
          name: "iot-central"
          azureCLIVersion: ${{ parameters.azureCLIVersion }}
          pythonVersion: $(python)
          serviceConnection: $(AzureServiceConnection)

  - job: "testADT"
    timeoutInMinutes: 120
    displayName: "Test Azure DigitalTwins"
    condition: and(succeeded(), eq('${{ parameters.testADT }}', true))
    strategy:
      matrix: $[ variables['pythonVersions'] ]
      maxParallel: ${{ parameters.maxParallelADT }}
    steps:
      - template: run-tests-parallel.yml
        parameters:
          path: "azext_iot/tests/digitaltwins"
          name: "azure-digitaltwins"
          azureCLIVersion: ${{ parameters.azureCLIVersion }}
          pythonVersion: $(python)
          serviceConnection: $(AzureServiceConnection)

  - job: "testDPS"
    timeoutInMinutes: 90
    displayName: "Test DPS"
    condition: and(succeeded(), eq('${{ parameters.testDPS }}', true))
    strategy:
      matrix: $[ variables['pythonVersions'] ]
      maxParallel: ${{ parameters.maxParallelDPS }}
    steps:
      - template: run-tests-parallel.yml
        parameters:
          path: "azext_iot/tests/dps"
          name: "device-provisioning-service"
          azureCLIVersion: ${{ parameters.azureCLIVersion }}
          pythonVersion: $(python)
          serviceConnection: $(AzureServiceConnection)

  - job: "HubControl"
    timeoutInMinutes: 190
    displayName: "HubControl - owned control-plane"
    dependsOn: [testCentral, testADT, testDPS, testADU, testADR]
    condition: and(not(canceled()), eq('${{ parameters.testHub }}', true))
    strategy:
      matrix: $[ variables['pythonVersions'] ]
      maxParallel: 1
    steps:
      - template: run-tests-parallel.yml
        parameters:
          hubSuite: HubControl
          hubSubscription: ${{ parameters.hubSubscription }}
          hubResourceGroup: ${{ parameters.hubResourceGroup }}
          hubRegion: ${{ parameters.hubRegion }}
          name: "HubControl"
          azureCLIVersion: ${{ parameters.azureCLIVersion }}
          pythonVersion: $(python)
          serviceConnection: $(AzureServiceConnection)

  - job: "HubData"
    timeoutInMinutes: 360
    dependsOn: HubControl
    condition: and(not(canceled()), eq('${{ parameters.testHub }}', true))
    displayName: "HubData - owned Entra and SAS phases"
    strategy:
      matrix: $[ variables['pythonVersions'] ]
      maxParallel: 1
    steps:
      - template: run-tests-parallel.yml
        parameters:
          hubSuite: HubData
          hubSubscription: ${{ parameters.hubSubscription }}
          hubResourceGroup: ${{ parameters.hubResourceGroup }}
          hubRegion: ${{ parameters.hubRegion }}
          name: "HubData"
          azureCLIVersion: ${{ parameters.azureCLIVersion }}
          pythonVersion: $(python)
          serviceConnection: $(AzureServiceConnection)

  - job: "testADU"
    timeoutInMinutes: 200
    displayName: "Test ADU"
    condition: and(succeeded(), eq('${{ parameters.testADU }}', true))
    strategy:
      matrix: $[ variables['pythonVersions'] ]
      maxParallel: ${{ parameters.maxParallelADU }}
    steps:
      - template: run-tests-parallel.yml
        parameters:
          path: "azext_iot/tests/deviceupdate"
          name: "azure-deviceupdate"
          azureCLIVersion: ${{ parameters.azureCLIVersion }}
          pythonVersion: $(python)
          num_reruns: 0
          serviceConnection: $(AzureServiceConnection)

  - job: "testADR"
    timeoutInMinutes: 200
    displayName: "Test ADR"
    condition: and(succeeded(), eq('${{ parameters.testADR }}', true))
    strategy:
      matrix: $[ variables['pythonVersions'] ]
      maxParallel: ${{ parameters.maxParallelADR }}
    steps:
      - template: run-tests-parallel.yml
        parameters:
          path: "azext_iot/tests/adr"
          name: "azure-deviceregistry"
          azureCLIVersion: ${{ parameters.azureCLIVersion }}
          pythonVersion: $(python)
          num_reruns: 0
          serviceConnection: $(AzureServiceConnection)

  - job: "unitTests"
    displayName: "Unit tests and code coverage"
    strategy:
      matrix: $[ variables['pythonVersions'] ]
      maxParallel: ${{ parameters.maxParallelUnit }}
    steps:
      - template: run-tests-parallel.yml
        parameters:
          azureCLIVersion: ${{ parameters.azureCLIVersion }}
          runIntTests: "false"
          runUnitTests: "true"
          pythonVersion: $(python)

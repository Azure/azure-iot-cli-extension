# tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
skip_missing_interpreters = true
envlist =
    clean
    lint
    python-azcur-unit
    report

[base]
distdir={toxworkdir}/build
deps =
    -r dev_requirements
description =
# py{x} determines python version for environment.
#    A valid interpreter must be installed (and added to PATH)
#    for each selected version, otherwise the run will be skipped
# az{x} determines:
#    {min} - minimum supported azure-cli
#    {cur} - latest released azure-cli
#    {dev} - installs azure-cli from ../azure-cli
# int/unit determines test suites to run
# list all available tox environments with: `tox -av`
    python: Local Python
    py310: Python 3.10
    py311: Python 3.11
    py312: Python 3.12
    py313: Python 3.13
    azmin: min azure-cli
    azcur: current azure-cli
    azdev: dev azure-cli
    int: Integration Tests
    unit: Unit Tests

[testenv:lint]
description = run linter
deps =
    {[base]deps}
    azure-cli
commands =
    flake8 azext_iot/ --statistics --config=setup.cfg
    pylint azext_iot/ --rcfile=.pylintrc

[testenv:py{thon,38,39,310,311,312,313}-az{min,cur,dev}-unit]
skip_install = True
description =
    {[base]description}
setenv =
    azext_iot_testrg=testrg
    AZURE_EXTENSION_DIR={envsitepackagesdir}/azure-cli-extensions
    PYTHONPATH={envsitepackagesdir}/azure-cli-extensions/azure-iot
passenv =
    azext_*
deps =
    # base deps
    {[base]deps}
    # azure-cli deps
    azmin: azure-cli==2.59.0
    azcur: azure-cli
    azdev: ../azure-cli/src/azure-cli
    azdev: ../azure-cli/src/azure-cli-core
    # azure cli test sdk
    azure-cli-testsdk
commands =
    python --version
    # install to tox extension dir
    pip install -U --target {envsitepackagesdir}/azure-cli-extensions/azure-iot .
    # validate az and extension version
    az -v
    # run tests
    # You can pass additional positional args to pytest using `-- {args}`
    pytest -k "_unit.py" ./azext_iot/tests \
    --cov=azext_iot --cov-append --cov-config .coveragerc --junitxml=junit/test-iotext-unit.xml {posargs}

[testenv:DPS-phases]
description = Install the standalone DPS controller outside the environment it manages.
skip_install = True
deps =
    {[base]deps}
    azure-cli
    .
commands =

# available integration test environments (pipeline coverage may be a subset)
[testenv:{Central,ADT,DPS,HubControl,HubData,ADU,ADR}-int]
skip_install = True
passenv =
    AZURE_*
    azext_*
    PRETTY_LOG
description =
    Central: IoT Central
    ADT: Digital Twin
    DPS: DPS
    HubControl: IoT Hub control-plane (owned serial manifest selection)
    HubData: IoT Hub data-plane (owned serial Entra and SAS phases)
    ADU: ADU
    ADR: ADR
    {[base]description}
deps =
    # base deps
    {[base]deps}
    azure-cli
    # azure cli test sdk
    azure-cli-testsdk
setenv =
    AZURE_TEST_RUN_LIVE=True
    PYTHONUNBUFFERED=1
    AZURE_DEFAULTS_IOTHUB-DATA-AUTH-TYPE=login
    AZURE_DEFAULTS_IOTDPS-DATA-AUTH-TYPE=login
    # Only debug DPS controllers set the managed bridge; keep full CI aggregation unchanged.
    DPS: COVERAGE_FILE={env:azext_iot_dps_coverage_file:.coverage}
    azext_iot_testhub_location={env:azext_iot_testhub_location:centraluseuap}
    PYTHONPATH={envsitepackagesdir}/azure-cli-extensions/azure-iot
    AZURE_EXTENSION_DIR={envsitepackagesdir}/azure-cli-extensions
    HubControl,HubData: azext_iot_hub_subscription={env:azext_iot_hub_subscription}
    HubControl,HubData: azext_iot_testrg={env:azext_iot_testrg:cli-int-test-rg}
    ADR: azext_iot_adr_subscription={env:azext_iot_adr_subscription:a386d5ea-ea90-441a-8263-d816368c84a1}
    ADR: azext_iot_adr_resource_group={env:azext_iot_adr_resource_group:cli-int-test-rg}
    ADR: azext_iot_adr_location=centraluseuap
    ADR: azext_iot_adr_arm_resource=https://management.azure.com
    ADR: azext_iot_adr_arm_endpoint=https://centraluseuap.management.azure.com
    ADR: azext_iot_adr_api_version=2026-11-02-preview
commands =
    python --version
    # install to tox extension dir
    pip install -U --target {envsitepackagesdir}/azure-cli-extensions/azure-iot .
    # validate az and extension version
    az -v
    # run tests
    # You can pass additional positional args to pytest using `-- {args}`

    Central: pytest -vv -k _int ./azext_iot/tests/central \
    Central:    --dist=loadfile -n 7 --reruns 2 --reruns-delay 60 \
    Central:    --cov=azext_iot --cov-append --cov-config .coveragerc --junitxml=junit/test-iotext-int.xml {posargs}

    ADT: pytest -vv -k _int ./azext_iot/tests/digitaltwins \
    ADT:    --dist=loadfile -n 7 --reruns 2 --reruns-delay 60 \
    ADT:    --cov=azext_iot --cov-append --cov-config .coveragerc --junitxml=junit/test-iotext-int.xml {posargs}

    # Module startup exposes checkout-only early plugins before conftest discovery.
    DPS: python -m pytest -vv --timeout=900 --integration-progress-interval=60 -o faulthandler_timeout=300 {env:azext_iot_dps_node_args:-k _int.py ./azext_iot/tests/dps} --dist=loadfile \
    DPS:    -n {env:azext_iot_dps_workers:7} -p no:rerunfailures \
    DPS:    --cov=azext_iot --cov-append --cov-config .coveragerc --junitxml={env:azext_iot_dps_junit:junit/test-iotext-dps-int.xml} {posargs}

    # Only validated controller options (including --debug-phase/--debug-node), never pytest filters.
    # Invoke from checkout: tests are intentionally excluded from the candidate wheel.
    HubControl: python {toxinidir}/azext_iot/tests/_hub_phase_runner.py --suite HubControl \
    HubData: python {toxinidir}/azext_iot/tests/_hub_phase_runner.py --suite HubData \
    HubControl,HubData:    --subscription {env:azext_iot_hub_subscription} \
    HubControl,HubData:    --resource-group {env:azext_iot_testrg:cli-int-test-rg} \
    HubControl,HubData:    --region {env:azext_iot_testhub_location:centraluseuap} --output test-result/hub-phases {posargs}

    ADU: pytest -vv -k _int ./azext_iot/tests/deviceupdate \
    ADU:    --dist=loadfile -n 7 --reruns 0 --reruns-delay 60 \
    ADU:    --cov=azext_iot --cov-append --cov-config .coveragerc --junitxml=junit/test-iotext-int.xml {posargs}

    ADR: pytest -vv --timeout=900 --integration-progress-interval=60 -o faulthandler_timeout=300 -k _int.py ./azext_iot/tests/adr \
    ADR:    -n 0 -p no:rerunfailures \
    ADR:    --cov=azext_iot --cov-append --cov-config .coveragerc --junitxml=junit/test-iotext-adr-int.xml {posargs}

# code coverage
[testenv:report]
deps = coverage
allowlist_externals = coverage
skip_install = true
commands =
    coverage report
    coverage html
    coverage json

# clean up code coverage
[testenv:clean]
deps = coverage
allowlist_externals = coverage
skip_install = true
commands = coverage erase
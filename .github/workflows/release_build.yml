name: "[auto] Build Wheel for Release"
permissions: {}
on:
  workflow_call:

jobs:
  build:
    runs-on:
      [
        self-hosted,
        1ES.Pool=iotupx-iot-cli-github-hosted-pool,
        1ES.ImageOverride=Ubuntu20.04Compliant,
      ]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/checkout@v4
      - name: "Az CLI login"
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Package feed authentication
        env:
          PIP_FEED_URL: ${{ secrets.PIP_FEED_URL }}
        run: |
          TOKEN=$(az account get-access-token --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "PIP_INDEX_URL=https://token:$TOKEN@${{ env.PIP_FEED_URL }}/simple/" >> $GITHUB_ENV
      - name: Build Wheel
        run: |
          pip install -r dev_requirements
          python -m build
      - name: Determine Wheel Version
        run: |
          wheel=$(find ./dist/*.whl)
          echo "wheel=$wheel" >> $GITHUB_ENV
          pip install $wheel
          version=$(pip show azure_iot | grep Version: | awk '{print $2}')
          echo "version=$version" >> $GITHUB_ENV
      - name: Generate SBOM
        run: |
          # Generate frozen requirements for sbom-tool to scan (avoids setup.py parsing issues with pip 25.x)
          pip freeze > ./dist/requirements.txt
          # Add Windows-specific azure-iot-device version (not installed on Linux CI, but needed for complete SBOM)
          # Note: This causes a pip conflict warning in sbom-tool but both versions are correctly included in SBOM
          echo "azure-iot-device>=2.15.0rc1,<3.0.0dev0" >> ./dist/requirements.txt
          curl -Lo $RUNNER_TEMP/sbom-tool https://github.com/microsoft/sbom-tool/releases/download/v4.1.5/sbom-tool-linux-x64
          chmod +x $RUNNER_TEMP/sbom-tool
          $RUNNER_TEMP/sbom-tool generate -b ./dist -bc ./dist -pn "Azure IoT CLI Extension" -pv "${{ env.version }}" -ps Microsoft
          # Clean up temporary file
          rm ./dist/requirements.txt

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.wheel }}
          name: azure-iot-cli-ext
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          path: dist/_manifest/
          name: SBOM

# INTERNAL: one Python/region cohort inside the locked integration bundle.
name: Integration test cohort (internal)

on:
  workflow_call:
    inputs:
      configs:
        description: "Validated configs for one Python/region: owned services or ADU alone."
        type: string
        required: true
      resource-group:
        type: string
        required: true
      subscription-id:
        type: string
        required: false
        default: ""
      adr-test-filter:
        type: string
        default: ""
      adr-revoke-certificates:
        type: boolean
        default: false
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: false

permissions:
  contents: read
  id-token: write

# Workflow-level env is not inherited across reusable workflow boundaries.
# Resolve the optional fallback here, using the same expression as root setup's
# scope hash. Explicit-subscription dispatch does not require a fallback secret.
env:
  RESOURCE_GROUP: ${{ inputs['resource-group'] }}
  TEST_SUBSCRIPTION_ID: ${{ inputs['subscription-id'] || secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  service:
    name: "${{ matrix.config.service }} py${{ matrix.config.python }} (${{ matrix.config.region }})"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.config.timeout }}
    # Up to four owned services in parallel, OR ADU alone. Do not add the scope
    # lock here: the caller holds it for this AND all later serial cohorts.
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(inputs.configs) }}
    env:
      TEST_SERVICE: ${{ matrix.config.service }}
      TEST_TOX_ENV: ${{ matrix.config.tox_env }}
      TEST_PYTHON: ${{ matrix.config.python }}
      TEST_REGION: ${{ matrix.config.region }}
    steps:
      - name: "Checkout source"
        uses: actions/checkout@v5

      - name: "Setup Python ${{ matrix.config.python }}"
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.config.python }}"
          cache: "pip" # Saves ~30-60s per matrix job by caching pip downloads

      - name: "Build and install extension"
        run: |
          pip install -r dev_requirements
          python -m build
          az extension add --source ./dist/*.whl -y
          # az CLI uses its own Python (e.g. 3.13) to install deps into the extension dir.
          # Binary packages like rpds-py and cryptography have version-specific .so files
          # that won't load under a different Python. Reinstall them for the test Python version.
          ext_dir=$(az extension show -n azure-iot --query path -o tsv 2>/dev/null || echo "")
          if [ -n "$ext_dir" ] && [ -d "$ext_dir" ]; then
            pip install --target "$ext_dir" --upgrade --force-reinstall --no-deps rpds-py cryptography
          fi

      - name: "Setup tox test environment"
        run: |
          pip install tox
          if [ "$TEST_SERVICE" = "DPS" ]; then
            tox r -vv -e DPS-phases,DPS-int --notest
          else
            tox r -vv -e "$TEST_TOX_ENV" --notest
          fi

      - name: "Az CLI login"
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.TEST_SUBSCRIPTION_ID }}

      - name: "Verify Azure access"
        run: |
          az account set --subscription "$TEST_SUBSCRIPTION_ID"
          az account show -o table
          az group show \
            --subscription "$TEST_SUBSCRIPTION_ID" \
            --name "$RESOURCE_GROUP" \
            --output table

      - name: "OIDC Token refresh service"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          while true; do
            token_request=$ACTIONS_ID_TOKEN_REQUEST_TOKEN
            token_uri=$ACTIONS_ID_TOKEN_REQUEST_URL
            token=$(curl -sH "Authorization: bearer $token_request" "${token_uri}&audience=api://AzureADTokenExchange" | jq .value -r)
            az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" --federated-token "$token" --output none
            az account set --subscription "$TEST_SUBSCRIPTION_ID"
            sleep 240
          done &

      - name: "Run ${{ matrix.config.service }} integration tests"
        id: run_tests
        env:
          AZURE_TEST_RUN_LIVE: "True"
          PYTHONUNBUFFERED: "1"
          azext_iot_testrg: ${{ env.RESOURCE_GROUP }}
          azext_iot_testhub_location: ${{ matrix.config.region }}
          azext_iot_hub_subscription: ${{ env.TEST_SUBSCRIPTION_ID }}
          AZURE_DEFAULTS_IOTHUB-DATA-AUTH-TYPE: login
          AZURE_DEFAULTS_IOTDPS-DATA-AUTH-TYPE: login
          azext_iot_adr_subscription: ${{ env.TEST_SUBSCRIPTION_ID }}
          azext_iot_adr_resource_group: ${{ env.RESOURCE_GROUP }}
          azext_iot_adr_location: ${{ matrix.config.region }}
          azext_iot_adr_revoke_certificates: ${{ matrix.config.service == 'ADR' && inputs['adr-revoke-certificates'] == true && 'true' || 'false' }}
          ADR_TEST_FILTER: ${{ inputs['adr-test-filter'] }}
        run: |
          set -o pipefail
          run_service() {
            if [ "$TEST_SERVICE" = "DPS" ]; then
              echo "DPS coverage: regular (including owned CSR issuance), service-SAS and serial local-auth-toggle."
              .tox/DPS-phases/bin/python azext_iot/tests/_dps_phase_runner.py \
                --subscription "$TEST_SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" \
                --region "$TEST_REGION"
            elif [ "$TEST_SERVICE" = "ADR" ] && [ -n "$ADR_TEST_FILTER" ]; then
              # Reject malformed expressions before wrapping, so parentheses cannot escape the integration-only guard.
              .tox/ADR-int/bin/python -c \
                'import os; from _pytest.mark.expression import Expression; Expression.compile(os.environ["ADR_TEST_FILTER"])' \
                || return $?
              tox r -e "$TEST_TOX_ENV" --skip-pkg-install -- \
                -k "(_int.py) and (${ADR_TEST_FILTER})"
            else
              tox r -e "$TEST_TOX_ENV" --skip-pkg-install
            fi
          }
          run_service 2>&1 | \
            sed -u 's/SharedAccessKey=[^;& "'"'"']*//g; s/AccountKey=[^;& "'"'"']*//g; s/sig=[^&"]*//g' | \
            sed -u 's/\("primaryKey"\s*:\s*\)"[^"]*"/\1"***"/g; s/\("secondaryKey"\s*:\s*\)"[^"]*"/\1"***"/g' | \
            sed -u 's/--pk [^ ]*/--pk ***/g; s/--sk [^ ]*/--sk ***/g; s/--key [^ ]*/--key ***/g' | \
            sed -u 's/--login [^ ]*/--login ***/g; s/-l [^ ]*/--login ***/g; s/--connection-string [^ ]*/--connection-string ***/g' | \
            tee test-output.log

      - name: "Record test result"
        if: ${{ always() }}
        env:
          TEST_STATUS: ${{ job.status }}
        run: |
          mkdir -p test-result
          printf '%s\n' "$TEST_STATUS" > test-result/status.txt
          printf '%s\n' "$TEST_SERVICE" > test-result/service.txt
          printf '%s\n' "$TEST_PYTHON" > test-result/python.txt
          printf '%s\n' "$TEST_REGION" > test-result/region.txt
          # Extract failed/errored test names from pytest output
          if [ -f test-output.log ]; then
            grep -E '^(FAILED|ERROR) azext_iot/tests/[^ ]+::' test-output.log | \
              sed 's/^FAILED //;s/^ERROR //;s/ - .*$//' > test-result/failures.txt || true
          fi
          touch test-result/failures.txt

      - name: "Upload test result"
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-result-${{ matrix.config.service }}-py${{ matrix.config.python }}-${{ matrix.config.region }}
          overwrite: true
          path: test-result/
          retention-days: 1

      - name: "Upload coverage artifact"
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.config.service }}-py${{ matrix.config.python }}-${{ matrix.config.region }}
          overwrite: true
          path: ./.coverage
          include-hidden-files: true
          retention-days: 30

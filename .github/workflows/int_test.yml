name: Integration Tests
run-name: >-
  Integration Tests (${{ inputs['test-services'] || 'auto' }} | ${{ inputs.regions || 'centraluseuap' }})

on:
  # Reusable workflow trigger — called programmatically by other workflows (e.g. release_workflow.yml)
  workflow_call:
    inputs:
      test-services:
        description: "Services (DPS,HubControl,HubData,ADU,ADR). HubData includes required Entra and SAS phases."
        type: string
        required: false
        default: "auto"
      python-versions:
        description: "Python versions (comma-separated: 3.10,3.11,3.12,3.13)"
        type: string
        required: false
        default: "3.13"
      regions:
        description: "Azure regions (comma-separated)"
        type: string
        required: false
        default: "centraluseuap"
      arm-endpoint:
        description: "ARM routing: auto (canary for centraluseuap, public otherwise), public, or canary"
        type: string
        required: false
        default: "auto"
      resource-group:
        description: "Resource group for test resources"
        type: string
        required: false
        default: "cli-int-test-rg"
      subscription-id:
        description: "Azure subscription containing the test resource group"
        type: string
        required: false
        default: ""
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
  # Manual trigger — run from GitHub Actions UI with checkbox/input controls
  workflow_dispatch:
    inputs:
      testDPS:
        description: "Run DPS tests"
        type: boolean
        default: true
      testHubControl:
        description: "Run IoT Hub control-plane tests"
        type: boolean
        default: true
      testHubData:
        description: "Run IoT Hub data-plane tests"
        type: boolean
        default: true
      testADU:
        description: "Run ADU tests"
        type: boolean
        default: true
      testADR:
        description: "Run ADR tests"
        type: boolean
        default: true
      python-versions:
        description: "Python versions (comma-separated: 3.10,3.11,3.12,3.13)"
        type: string
        required: false
        default: "3.13"
      regions:
        description: "Azure regions (comma-separated)"
        type: string
        required: false
        default: "centraluseuap"
      arm-endpoint:
        description: "ARM routing (canary requires centraluseuap)"
        type: choice
        required: false
        default: "auto"
        options:
          - auto
          - public
          - canary
      resource-group:
        description: "Resource group for test resources"
        type: string
        required: false
        default: "cli-int-test-rg"
      subscription-id:
        description: "Azure subscription containing the test resource group"
        type: string
        required: false
        default: "a386d5ea-ea90-441a-8263-d816368c84a1"

permissions:
  contents: "read"
  id-token: "write"

env:
  RESOURCE_GROUP: "${{ inputs['resource-group'] || 'cli-int-test-rg' }}"
  TEST_SUBSCRIPTION_ID: "${{ inputs['subscription-id'] || secrets.AZURE_SUBSCRIPTION_ID }}"

jobs:
  setup:
    name: "Detect test matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: "Checkout source"
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            azext_iot/tests

      - name: "Build test matrix"
        id: matrix
        env:
          INPUT_SERVICES: ${{ inputs['test-services'] }}
          INPUT_PYTHON_VERSIONS: ${{ inputs['python-versions'] || '3.13' }}
          INPUT_REGIONS: ${{ inputs.regions || 'centraluseuap' }}
          INPUT_ARM_ENDPOINT: ${{ inputs['arm-endpoint'] || 'auto' }}
          INPUT_TEST_DPS: ${{ inputs.testDPS }}
          INPUT_TEST_HUB_CONTROL: ${{ inputs.testHubControl }}
          INPUT_TEST_HUB_DATA: ${{ inputs.testHubData }}
          INPUT_TEST_ADU: ${{ inputs.testADU }}
          INPUT_TEST_ADR: ${{ inputs.testADR }}
        run: |
          set -euo pipefail
          # --- Service registry: service|test_dir|tox_env|timeout ---
          all_services=(
            # Regular -> service-SAS -> serial local-auth-toggle; certificate is not wired.
            "DPS|azext_iot/tests/dps|DPS-int|150"
            # Controller ceilings 210/345 minutes plus 15 minutes external setup; GH cap is 360.
            "HubControl|azext_iot/tests/iothub|HubControl-int|225"
            "HubData|azext_iot/tests/iothub|HubData-int|360"
            "ADU|azext_iot/tests/deviceupdate|ADU-int|200"
            # Serial ADR includes a 175-minute SU link envelope and a separate 75-minute SU lifecycle.
            # Reserve the hosted-job ceiling; per-operation waits and ordinary 15-minute caps stay unchanged.
            "ADR|azext_iot/tests/adr|ADR-int|360"
          )

          # --- Determine which services to include ---
          input_services="$INPUT_SERVICES"
          services=""

          if [ -z "$input_services" ]; then
            # Direct workflow_dispatch: filter by boolean toggles + directory existence
            declare -A toggles=(
              [DPS]="$INPUT_TEST_DPS"
              [HubControl]="$INPUT_TEST_HUB_CONTROL"
              [HubData]="$INPUT_TEST_HUB_DATA"
              [ADU]="$INPUT_TEST_ADU"
              [ADR]="$INPUT_TEST_ADR"
            )
            for entry in "${all_services[@]}"; do
              IFS='|' read -r svc test_dir tox_env timeout <<< "$entry"
              [ "${toggles[$svc]}" = "true" ] && [ -d "$test_dir" ] && services="${services}${svc},"
            done
          elif [ "$input_services" = "auto" ]; then
            # auto: include all services whose test directory exists on this branch
            for entry in "${all_services[@]}"; do
              IFS='|' read -r svc test_dir tox_env timeout <<< "$entry"
              [ -d "$test_dir" ] && services="${services}${svc},"
            done
          else
            services="$input_services,"
          fi
          services="${services%,}" # trim trailing comma

          if [ -z "$services" ]; then
            echo "::error::No services selected or no test directories found on this branch."
            exit 1
          fi

          python_versions="$INPUT_PYTHON_VERSIONS"
          regions="$INPUT_REGIONS"
          case "$INPUT_ARM_ENDPOINT" in
            auto|public|canary) ;;
            *)
              echo "::error::arm-endpoint must be auto, public, or canary."
              exit 1
              ;;
          esac

          for value in "$services" "$python_versions" "$regions"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* || "$value" =~ (^|,)[[:space:]]*(,|$) ]]; then
              echo "::error::Matrix inputs must be single-line CSV lists without empty entries."
              exit 1
            fi
          done

          echo "Services: $services"
          echo "Python versions: $python_versions"
          echo "Regions: $regions"

          # --- Build JSON matrix: service × python × region ---
          matrix="["
          first=true

          IFS=',' read -ra SVC_ARRAY <<< "$services"
          IFS=',' read -ra PY_ARRAY <<< "$python_versions"
          IFS=',' read -ra REGION_ARRAY <<< "$regions"

          for svc in "${SVC_ARRAY[@]}"; do
            svc=$(echo "$svc" | xargs)
            # Look up metadata from registry
            tox_env=""; timeout=""
            for entry in "${all_services[@]}"; do
              IFS='|' read -r s d t tm <<< "$entry"
              [ "$s" = "$svc" ] && tox_env="$t" && timeout="$tm" && break
            done
            if [ -z "$tox_env" ]; then
              echo "::error::Unknown service: $svc"
              exit 1
            fi

            for py in "${PY_ARRAY[@]}"; do
              py=$(echo "$py" | xargs)
              if [[ ! "$py" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?$ ]]; then
                echo "::error::Python versions must be numeric major.minor or major.minor.patch values."
                exit 1
              fi
              for region in "${REGION_ARRAY[@]}"; do
                region=$(echo "$region" | xargs)
                if [[ ! "$region" =~ ^[a-z0-9]{1,64}$ ]]; then
                  echo "::error::Regions must be Azure region identifiers."
                  exit 1
                fi
                arm_endpoint="https://management.azure.com"
                if [[ "$INPUT_ARM_ENDPOINT" = canary || ( "$INPUT_ARM_ENDPOINT" = auto && "$region" = centraluseuap ) ]]; then
                  if [ "$region" != centraluseuap ]; then
                    echo "::error::Canary ARM requires region centraluseuap."
                    exit 1
                  fi
                  arm_endpoint="https://centraluseuap.management.azure.com"
                fi
                if [[ "$svc" = HubControl || "$svc" = HubData || \
                      ( "$arm_endpoint" = https://management.azure.com && ( "$svc" = DPS || "$svc" = ADR ) ) ]] && \
                   [[ "$TEST_SUBSCRIPTION_ID" != a386d5ea-ea90-441a-8263-d816368c84a1 || "$RESOURCE_GROUP" != cli-int-test-rg ]]; then
                  echo "::error::Hub/public ARM live phases require the authorized subscription and cli-int-test-rg."
                  exit 1
                fi

                if [ "$first" = true ]; then first=false; else matrix="$matrix,"; fi
                matrix="$matrix{\"service\":\"$svc\",\"tox_env\":\"$tox_env\",\"timeout\":$timeout,\"python\":\"$py\",\"region\":\"$region\",\"arm_endpoint\":\"$arm_endpoint\"}"
              done
            done
          done
          matrix="$matrix]"

          job_count=$(echo "$matrix" | jq length)
          # Fail before login instead of losing duplicate results to artifact overwrite
          # or silently truncating combinations at the Actions matrix limit.
          if [ "$job_count" -gt 256 ] || \
             [ "$(echo "$matrix" | jq 'unique_by(.service, .python, .region) | length')" -ne "$job_count" ]; then
            echo "::error::Select at most 256 unique service/Python/region combinations; duplicates are not allowed."
            exit 1
          fi
          echo ""
          echo "┌──────────────────────────────────────────────────────────┐"
          title="Test Matrix: $job_count job(s)"
          printf "│  %-56s│\n" "$title"
          echo "├───────────┬─────────┬──────────────┬─────────────────────┤"
          echo "│  Service  │ Python  │    Region    │  Timeout            │"
          echo "├───────────┼─────────┼──────────────┼─────────────────────┤"
          echo "$matrix" | jq -r '.[] | "│  \(.service)\(" " * ([1, 9 - (.service | length)] | max))│ \(.python)\(" " * (8 - (.python | length)))│  \(.region)\(" " * ([1, 12 - (.region | length)] | max))│  \(.timeout) min\(" " * (19 - ((.timeout | tostring) + " min" | length)))│"'
          echo "└───────────┴─────────┴──────────────┴─────────────────────┘"
          echo ""
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          # --- Write summary table ---
          echo "## Test Matrix ($(echo "$matrix" | jq length) jobs)" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Python | Region | ARM endpoint | Timeout |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|--------|--------------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "$matrix" | jq -r '.[] | "| \(.service) | \(.python) | \(.region) | \(.arm_endpoint) | \(.timeout) min |"' >> $GITHUB_STEP_SUMMARY

  unit-test:
    name: "Linter and unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: "Checkout source"
        uses: actions/checkout@v5

      - name: "Setup Python 3.13"
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip" # Cache pip downloads to avoid re-downloading packages across runs

      - name: "Setup test suite"
        run: |
          python -m pip install tox
          tox r -vv --notest

      - name: "Run linter and unit tests"
        run: tox r --skip-pkg-install

      - name: "Upload coverage report"
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-unit
          overwrite: true
          path: ./.coverage
          include-hidden-files: true
          retention-days: 30

  int-test:
    name: "${{ matrix.config.service }} py${{ matrix.config.python }} (${{ matrix.config.region }})"
    needs: [setup, unit-test]
    if: ${{ needs.setup.result == 'success' && needs.unit-test.result == 'success' && (needs.setup.outputs.matrix || '[]') != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.config.timeout }}
    # All selected service/Python/region combinations are independently eligible,
    # including ADU. Owned controllers still sequence their internal auth phases.
    # Scheduling never authorizes resource mutation: ownership/scope checks remain required.
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.matrix || '[]') }}
    env:
      TEST_SERVICE: ${{ matrix.config.service }}
      TEST_TOX_ENV: ${{ matrix.config.tox_env }}
      TEST_PYTHON: ${{ matrix.config.python }}
      TEST_REGION: ${{ matrix.config.region }}
      TEST_ARM_ENDPOINT: ${{ matrix.config.arm_endpoint }}
    steps:
      - name: "Checkout source"
        uses: actions/checkout@v5

      - name: "Setup Python ${{ matrix.config.python }}"
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.config.python }}"
          cache: "pip" # Saves ~30-60s per matrix job by caching pip downloads

      - name: "Build and install extension"
        run: |
          pip install -r dev_requirements
          python -m build
          az extension add --source ./dist/*.whl -y
          # az CLI uses its own Python (e.g. 3.13) to install deps into the extension dir.
          # Binary packages like rpds-py and cryptography have version-specific .so files
          # that won't load under a different Python. Reinstall them for the test Python version.
          ext_dir=$(az extension show -n azure-iot --query path -o tsv 2>/dev/null || echo "")
          if [ -n "$ext_dir" ] && [ -d "$ext_dir" ]; then
            pip install --target "$ext_dir" --upgrade --force-reinstall --no-deps rpds-py cryptography
          fi

      - name: "Setup tox test environment"
        run: |
          pip install tox
          if [ "$TEST_SERVICE" = "DPS" ]; then
            tox r -vv -e DPS-phases,DPS-int --notest
          else
            tox r -vv -e "$TEST_TOX_ENV" --notest
          fi

      - name: "Az CLI login"
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.TEST_SUBSCRIPTION_ID }}

      - name: "Verify Azure access"
        run: |
          az account set --subscription "$TEST_SUBSCRIPTION_ID"
          az account show -o table
          az group show \
            --subscription "$TEST_SUBSCRIPTION_ID" \
            --name "$RESOURCE_GROUP" \
            --output table

      - name: "Run ${{ matrix.config.service }} integration tests"
        id: run_tests
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TEST_RUN_LIVE: "True"
          PYTHONUNBUFFERED: "1"
          azext_iot_testrg: ${{ env.RESOURCE_GROUP }}
          azext_iot_testhub_location: ${{ matrix.config.region }}
          azext_iot_test_arm_endpoint: ${{ matrix.config.arm_endpoint }}
          AZURE_IOT_ADR_ARM_ENDPOINT: ${{ matrix.config.arm_endpoint }}
          azext_iot_hub_subscription: ${{ env.TEST_SUBSCRIPTION_ID }}
          AZURE_DEFAULTS_IOTHUB-DATA-AUTH-TYPE: login
          AZURE_DEFAULTS_IOTDPS-DATA-AUTH-TYPE: login
          azext_iot_adr_subscription: ${{ env.TEST_SUBSCRIPTION_ID }}
          azext_iot_adr_resource_group: ${{ env.RESOURCE_GROUP }}
          azext_iot_adr_location: ${{ matrix.config.region }}
          azext_iot_adr_arm_endpoint: ${{ matrix.config.arm_endpoint }}
          azext_iot_adr_arm_resource: https://management.azure.com
        run: |
          set -euo pipefail
          # The base build Python has no CLI. Use the same CLI/cache implementation
          # as the tests (DPS's controller lives outside its managed environment).
          auth_python=".tox/$TEST_TOX_ENV/bin/python"
          if [ "$TEST_SERVICE" = "DPS" ]; then
            auth_python=".tox/DPS-phases/bin/python"
          fi
          # Fail before test execution if the explicit current account or auth is wrong.
          "$auth_python" azext_iot/tests/_refresh_ci_auth.py
          auth_ready=$(mktemp)
          mkdir -p test-result
          # A stalled writer must not keep the step's output pipe open on failure.
          auth_log=test-result/auth-refresh.log
          "$auth_python" azext_iot/tests/_refresh_ci_auth.py --loop --ready-file "$auth_ready" >"$auth_log" 2>&1 &
          auth_pid=$!
          stop_auth() {
            result=$?
            trap - EXIT
            # A dead refresher (even exit 0) invalidates the run. A graceful stop
            # waits for any in-flight cache persistence rather than interrupting it.
            if ! kill -TERM "$auth_pid" 2>/dev/null; then
              result=1
            fi
            auth_stop_deadline=$((SECONDS + 180))
            while kill -0 "$auth_pid" 2>/dev/null; do
              if [ "$SECONDS" -ge "$auth_stop_deadline" ]; then
                echo "::error::OIDC refresher did not stop within 180 seconds; cache persistence was not force-killed."
                cat "$auth_log"
                rm -f "$auth_ready"
                exit 1
              fi
              sleep 0.1
            done
            if ! wait "$auth_pid"; then
              result=1
            fi
            cat "$auth_log"
            rm -f "$auth_ready"
            if [ "$result" -ne 0 ]; then
              echo "::error::Integration tests or OIDC credential refresh failed."
            fi
            exit "$result"
          }
          trap stop_auth EXIT
          # Even very short tests must not stop Python before its handlers exist.
          auth_deadline=$((SECONDS + 30))
          while [ ! -s "$auth_ready" ]; do
            if ! kill -0 "$auth_pid" 2>/dev/null || [ "$SECONDS" -ge "$auth_deadline" ]; then
              echo "::error::OIDC credential refresher did not become ready."
              exit 1
            fi
            sleep 0.1
          done
          run_service() {
            if [ "$TEST_SERVICE" = "DPS" ]; then
              echo "DPS coverage: regular (including owned CSR issuance), service-SAS and serial local-auth-toggle."
              .tox/DPS-phases/bin/python azext_iot/tests/_dps_phase_runner.py \
                --subscription "$TEST_SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" \
                --region "$TEST_REGION" --arm-endpoint "$TEST_ARM_ENDPOINT"
            else
              tox r -e "$TEST_TOX_ENV" --skip-pkg-install
            fi
          }
          run_service 2>&1 | \
            sed -u 's/SharedAccessKey=[^;& "'"'"']*//g; s/AccountKey=[^;& "'"'"']*//g; s/sig=[^&"]*//g' | \
            sed -u 's/\("primaryKey"\s*:\s*\)"[^"]*"/\1"***"/g; s/\("secondaryKey"\s*:\s*\)"[^"]*"/\1"***"/g' | \
            sed -u 's/--pk [^ ]*/--pk ***/g; s/--sk [^ ]*/--sk ***/g; s/--key [^ ]*/--key ***/g' | \
            sed -u 's/--login [^ ]*/--login ***/g; s/-l [^ ]*/--login ***/g; s/--connection-string [^ ]*/--connection-string ***/g' | \
            tee test-output.log

      - name: "Record test result"
        if: ${{ always() }}
        env:
          TEST_STATUS: ${{ job.status }}
        run: |
          mkdir -p test-result
          printf '%s\n' "$TEST_STATUS" > test-result/status.txt
          printf '%s\n' "$TEST_SERVICE" > test-result/service.txt
          printf '%s\n' "$TEST_PYTHON" > test-result/python.txt
          printf '%s\n' "$TEST_REGION" > test-result/region.txt
          printf '%s\n' "$TEST_ARM_ENDPOINT" > test-result/arm-endpoint.txt
          # ADR persists metadata-only outcomes before every phase hook returns.
          # Never overwrite them with an empty final-summary scrape after cancellation.
          if [ "$TEST_SERVICE" = "ADR" ]; then
            if [ ! -f test-result/integration-outcomes.json ] || [ ! -f test-result/failures.txt ]; then
              printf '%s\n' 'ADR incremental test evidence is missing; execution/coverage is unproven.' >> test-result/failures.txt
            elif [ "$TEST_STATUS" != "success" ] && [ ! -s test-result/failures.txt ]; then
              printf '%s\n' 'ADR job did not succeed; inspect status.txt and integration-outcomes.json.' >> test-result/failures.txt
            fi
          elif [ -f test-output.log ]; then
            grep -E '^(FAILED|ERROR) azext_iot/tests/[^ ]+::' test-output.log | \
              sed 's/^FAILED //;s/^ERROR //;s/ - .*$//' > test-result/failures.txt || true
          fi
          touch test-result/failures.txt

      - name: "Upload test result"
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-result-${{ matrix.config.service }}-py${{ matrix.config.python }}-${{ matrix.config.region }}
          overwrite: true
          path: test-result/
          retention-days: 1

      - name: "Upload coverage artifact"
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.config.service }}-py${{ matrix.config.python }}-${{ matrix.config.region }}
          overwrite: true
          path: ./.coverage
          include-hidden-files: true
          retention-days: 30

  int-test-gate:
    name: "Integration test gate"
    needs: [setup, unit-test, int-test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout source"
        uses: actions/checkout@v5

      - name: "Download all test results"
        uses: actions/download-artifact@v7
        with:
          pattern: test-result-*
          path: ./test-results

      - name: "Evaluate per-service results"
        if: ${{ always() }}
        env:
          INTEGRATION_MATRIX: ${{ needs.setup.outputs.matrix || '[]' }}
          SETUP_RESULT: ${{ needs.setup.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
          INTEGRATION_RESULT: ${{ needs.int-test.result }}
          GATE_JOB_RESULT: ${{ job.status }}
        run: >-
          python3 azext_iot/tests/_evaluate_test_results.py --results-dir ./test-results

  combine-coverage:
    name: "Combine coverage reports"
    if: always()
    needs: [setup, unit-test, int-test, int-test-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout source"
        uses: actions/checkout@v5

      - name: "Download all coverage artifacts"
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: ./coverage_parts

      - name: "Combine coverage and generate report"
        run: |
          pip install coverage
          mapfile -t coverage_files < <(find ./coverage_parts -type f -name .coverage)
          if [ "${#coverage_files[@]}" -gt 0 ]; then
            coverage combine "${coverage_files[@]}"
            coverage report
            coverage html --directory ./htmlcov
          else
            echo "No coverage files found — skipping combine/report."
            echo "### ⚠️ No coverage data collected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Upload combined coverage artifact"
        uses: actions/upload-artifact@v6
        with:
          name: combined-coverage
          overwrite: true
          path: ./htmlcov
          retention-days: 30

      - name: "Write job summary"
        if: ${{ always() }}
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
          INTEGRATION_RESULT: ${{ needs.int-test.result }}
          GATE_RESULT: ${{ needs.int-test-gate.result }}
          COVERAGE_RESULT: ${{ job.status }}
        run: |
          if [ "$SETUP_RESULT" = "success" ] && [ "$UNIT_TEST_RESULT" = "success" ] && \
             [ "$INTEGRATION_RESULT" = "success" ] && [ "$GATE_RESULT" = "success" ] && \
             [ "$COVERAGE_RESULT" = "success" ]; then
            echo "### All workflow checks passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Workflow did not succeed" >> "$GITHUB_STEP_SUMMARY"
            printf -- '- Matrix setup: %s\n- Unit tests: %s\n- Integration jobs: %s\n- Integration gate: %s\n- Coverage: %s\n' \
              "$SETUP_RESULT" "$UNIT_TEST_RESULT" "$INTEGRATION_RESULT" "$GATE_RESULT" "$COVERAGE_RESULT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

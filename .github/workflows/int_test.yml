name: Integration Tests
run-name: >-
  Integration Tests (${{ inputs['test-services'] || 'auto' }} | ${{ inputs.regions || 'centraluseuap' }})

on:
  # Reusable workflow trigger — called programmatically by other workflows (e.g. release_workflow.yml)
  workflow_call:
    inputs:
      test-services:
        description: "Services (DPS,HubControl,HubData,ADU,ADR). HubData includes required Entra and SAS phases."
        type: string
        required: false
        default: "auto"
      adr-test-filter:
        description: "ADR-only pytest -k expression; empty runs the full ADR integration suite."
        type: string
        required: false
        default: ""
      adr-revoke-certificates:
        description: "Opt in to revocation scenarios using only newly created, test-owned ADR CAs."
        type: boolean
        required: false
        default: false
      python-versions:
        description: "Python versions (comma-separated: 3.10,3.11,3.12,3.13)"
        type: string
        required: false
        default: "3.13"
      regions:
        description: "Azure regions (comma-separated)"
        type: string
        required: false
        default: "centraluseuap"
      resource-group:
        description: "Resource group for test resources"
        type: string
        required: false
        default: "cli-int-test-rg"
      subscription-id:
        description: "Azure subscription containing the test resource group"
        type: string
        required: false
        default: ""
      dps-capacity-limit:
        description: "Confirmed DPS instance limit for the selected subscription/run; otherwise keep 10."
        type: string
        required: false
        default: "10"
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
  # Manual trigger — run from GitHub Actions UI with checkbox/input controls
  workflow_dispatch:
    inputs:
      testDPS:
        description: "Run DPS tests"
        type: boolean
        default: true
      testHubControl:
        description: "Run owned IoT Hub control-plane tests"
        type: boolean
        default: true
      testHubData:
        description: "Run owned IoT Hub data-plane tests (Entra and SAS)"
        type: boolean
        default: true
      testADU:
        description: "Run ADU tests"
        type: boolean
        default: true
      testADR:
        description: "Run ADR tests"
        type: boolean
        default: true
      adr-test-filter:
        description: "ADR-only pytest -k expression; empty runs the full ADR integration suite."
        type: string
        required: false
        default: ""
      adr-revoke-certificates:
        description: "Opt in to revocation scenarios using only newly created, test-owned ADR CAs."
        type: boolean
        required: false
        default: false
      python-versions:
        description: "Python versions (comma-separated: 3.10,3.11,3.12,3.13)"
        type: string
        required: false
        default: "3.13"
      regions:
        description: "Azure regions (comma-separated)"
        type: string
        required: false
        default: "centraluseuap"
      resource-group:
        description: "Resource group for test resources"
        type: string
        required: false
        default: "cli-int-test-rg"
      subscription-id:
        description: "Azure subscription containing the test resource group"
        type: string
        required: false
        default: "a386d5ea-ea90-441a-8263-d816368c84a1"
      dps-capacity-limit:
        description: "Confirmed DPS instance limit for the selected subscription/run; otherwise keep 10."
        type: string
        required: false
        default: "10"

permissions:
  contents: "read"
  id-token: "write"

env:
  RESOURCE_GROUP: "${{ inputs['resource-group'] || 'cli-int-test-rg' }}"
  TEST_SUBSCRIPTION_ID: "${{ inputs['subscription-id'] || secrets.AZURE_SUBSCRIPTION_ID }}"

jobs:
  setup:
    name: "Detect test matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      cohorts: ${{ steps.matrix.outputs.cohorts }}
      live-scope: ${{ steps.matrix.outputs.live-scope }}
    steps:
      - name: "Checkout source"
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            azext_iot/tests

      - name: "Validate DPS capacity limit"
        env:
          DPS_CAPACITY_LIMIT: ${{ inputs['dps-capacity-limit'] }}
        run: >-
          python3 -c 'import os, runpy;
          runpy.run_path("azext_iot/tests/dps/_phase_manifest.py")["parse_capacity_limit"](os.environ["DPS_CAPACITY_LIMIT"])'
      - name: "Build test matrix"
        id: matrix
        env:
          INPUT_SERVICES: ${{ inputs['test-services'] }}
          INPUT_PYTHON_VERSIONS: ${{ inputs['python-versions'] || '3.13' }}
          INPUT_REGIONS: ${{ inputs.regions || 'centraluseuap' }}
          INPUT_TEST_DPS: ${{ inputs.testDPS }}
          INPUT_TEST_HUB_CONTROL: ${{ inputs.testHubControl }}
          INPUT_TEST_HUB_DATA: ${{ inputs.testHubData }}
          INPUT_TEST_ADU: ${{ inputs.testADU }}
          INPUT_TEST_ADR: ${{ inputs.testADR }}
        run: |
          set -euo pipefail
          # --- Service registry: service|test_dir|tox_env|timeout ---
          all_services=(
            # Regular -> service-SAS -> serial local-auth-toggle; certificate is not wired.
            "DPS|azext_iot/tests/dps|DPS-int|150"
            # Controller ceilings 210/345 minutes plus 15 minutes external setup; GH cap is 360.
            "HubControl|azext_iot/tests/iothub|HubControl-int|225"
            "HubData|azext_iot/tests/iothub|HubData-int|360"
            "ADU|azext_iot/tests/deviceupdate|ADU-int|200"
            # SU readiness already allows an hour; ordinary ADR items retain their 15-minute cap.
            "ADR|azext_iot/tests/adr|ADR-int|120"
          )

          # --- Determine which services to include ---
          input_services="$INPUT_SERVICES"
          services=""

          if [ -z "$input_services" ]; then
            # Direct workflow_dispatch: filter by boolean toggles + directory existence
            declare -A toggles=(
              [DPS]="$INPUT_TEST_DPS"
              [HubControl]="$INPUT_TEST_HUB_CONTROL"
              [HubData]="$INPUT_TEST_HUB_DATA"
              [ADU]="$INPUT_TEST_ADU"
              [ADR]="$INPUT_TEST_ADR"
            )
            for entry in "${all_services[@]}"; do
              IFS='|' read -r svc test_dir tox_env timeout <<< "$entry"
              [ "${toggles[$svc]}" = "true" ] && [ -d "$test_dir" ] && services="${services}${svc},"
            done
          elif [ "$input_services" = "auto" ]; then
            # auto: include all services whose test directory exists on this branch
            for entry in "${all_services[@]}"; do
              IFS='|' read -r svc test_dir tox_env timeout <<< "$entry"
              [ -d "$test_dir" ] && services="${services}${svc},"
            done
          else
            services="$input_services,"
          fi
          services="${services%,}" # trim trailing comma

          if [ -z "$services" ]; then
            echo "::error::No services selected or no test directories found on this branch."
            exit 1
          fi

          python_versions="$INPUT_PYTHON_VERSIONS"
          regions="$INPUT_REGIONS"

          for value in "$services" "$python_versions" "$regions"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* || "$value" =~ (^|,)[[:space:]]*(,|$) ]]; then
              echo "::error::Matrix inputs must be single-line CSV lists without empty entries."
              exit 1
            fi
          done

          echo "Services: $services"
          echo "Python versions: $python_versions"
          echo "Regions: $regions"

          # --- Build JSON matrix: service × python × region ---
          matrix="["
          first=true

          IFS=',' read -ra SVC_ARRAY <<< "$services"
          IFS=',' read -ra PY_ARRAY <<< "$python_versions"
          IFS=',' read -ra REGION_ARRAY <<< "$regions"

          for svc in "${SVC_ARRAY[@]}"; do
            svc=$(echo "$svc" | xargs)
            # Look up metadata from registry
            tox_env=""; timeout=""
            for entry in "${all_services[@]}"; do
              IFS='|' read -r s d t tm <<< "$entry"
              [ "$s" = "$svc" ] && tox_env="$t" && timeout="$tm" && break
            done
            if [ -z "$tox_env" ]; then
              echo "::error::Unknown service: $svc"
              exit 1
            fi

            for py in "${PY_ARRAY[@]}"; do
              py=$(echo "$py" | xargs)
              if [[ ! "$py" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?$ ]]; then
                echo "::error::Python versions must be numeric major.minor or major.minor.patch values."
                exit 1
              fi
              for region in "${REGION_ARRAY[@]}"; do
                region=$(echo "$region" | xargs)
                if [[ ! "$region" =~ ^[a-z0-9]{1,64}$ ]]; then
                  echo "::error::Regions must be Azure region identifiers."
                  exit 1
                fi
                if [[ "$svc" = HubControl || "$svc" = HubData ]]; then
                  if [ "$region" != centraluseuap ] || \
                     [ "$TEST_SUBSCRIPTION_ID" != a386d5ea-ea90-441a-8263-d816368c84a1 ] || \
                     [ "$RESOURCE_GROUP" != cli-int-test-rg ]; then
                    echo "::error::Hub live phases require the authorized subscription, cli-int-test-rg and centraluseuap."
                    exit 1
                  fi
                fi

                if [ "$first" = true ]; then first=false; else matrix="$matrix,"; fi
                matrix="$matrix{\"service\":\"$svc\",\"tox_env\":\"$tox_env\",\"timeout\":$timeout,\"python\":\"$py\",\"region\":\"$region\"}"
              done
            done
          done
          matrix="$matrix]"

          job_count=$(echo "$matrix" | jq length)
          # Fail before login instead of losing duplicate results to artifact overwrite
          # or silently truncating combinations at the Actions matrix limit.
          if [ "$job_count" -gt 256 ] || \
             [ "$(echo "$matrix" | jq 'unique_by(.service, .python, .region) | length')" -ne "$job_count" ]; then
            echo "::error::Select at most 256 unique service/Python/region combinations; duplicates are not allowed."
            exit 1
          fi
          # Keep the original flat matrix for result/coverage qualification.
          # Parallelize only DPS/HubControl/HubData/ADR. ADU's legacy Hub consumers
          # run in a separate serial cohort after the owned services for each
          # Python/region pair; omit empty cohorts, never selected matrix entries.
          cohorts=$(echo "$matrix" | jq -c 'group_by(.python, .region) |
            map([map(select(.service != "ADU")), map(select(.service == "ADU"))] |
              .[] | select(length > 0) |
              {python: .[0].python, region: .[0].region, configs: .})')
          echo ""
          echo "┌──────────────────────────────────────────────────────────┐"
          title="Test Matrix: $job_count job(s)"
          printf "│  %-56s│\n" "$title"
          echo "├───────────┬─────────┬──────────────┬─────────────────────┤"
          echo "│  Service  │ Python  │    Region    │  Timeout            │"
          echo "├───────────┼─────────┼──────────────┼─────────────────────┤"
          echo "$matrix" | jq -r '.[] | "│  \(.service)\(" " * ([1, 9 - (.service | length)] | max))│ \(.python)\(" " * (8 - (.python | length)))│  \(.region)\(" " * ([1, 12 - (.region | length)] | max))│  \(.timeout) min\(" " * (19 - ((.timeout | tostring) + " min" | length)))│"'
          echo "└───────────┴─────────┴──────────────┴─────────────────────┘"
          echo ""
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "cohorts=$cohorts" >> "$GITHUB_OUTPUT"
          # Hash normalized scope so Actions does not suppress an output containing a subscription secret.
          scope=$(printf '%s/%s' "${TEST_SUBSCRIPTION_ID,,}" "${RESOURCE_GROUP,,}" | sha256sum | cut -d ' ' -f 1)
          echo "live-scope=$scope" >> $GITHUB_OUTPUT

          # --- Write summary table ---
          echo "## Test Matrix ($(echo "$matrix" | jq length) jobs)" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Python | Region | Timeout |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "$matrix" | jq -r '.[] | "| \(.service) | \(.python) | \(.region) | \(.timeout) min |"' >> $GITHUB_STEP_SUMMARY

  unit-test:
    name: "Linter and unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: "Checkout source"
        uses: actions/checkout@v5

      - name: "Setup Python 3.13"
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip" # Cache pip downloads to avoid re-downloading packages across runs

      - name: "Setup test suite"
        run: |
          python -m pip install tox
          tox r -vv --notest

      - name: "Run linter and unit tests"
        run: tox r --skip-pkg-install

      - name: "Upload coverage report"
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-unit
          overwrite: true
          path: ./.coverage
          include-hidden-files: true
          retention-days: 30

  int-test:
    name: "Integration service bundle"
    needs: [setup, unit-test]
    if: ${{ needs.setup.result == 'success' && needs.unit-test.result == 'success' && (needs.setup.outputs.matrix || '[]') != '[]' }}
    # One lock holder per RUN, not per service or cohort. Keep the existing scope
    # key so other same-scope callers remain mutually exclusive with this bundle.
    # Internal workflows must not reacquire it: pending siblings could be cancelled.
    # Serial cohorts bound the conservative reservation for the four selected
    # DPS/HubControl/HubData/ADR services (18 extra Hubs / 5 extra DPS at the canary).
    # That reservation does not qualify the all-five UI default: ADU is a separate
    # serial Hub-consuming cohort under this same lock and needs its own headroom.
    # This is scheduling, NOT admission: fresh headroom/foreign-consumer checks
    # remain required. Neither the lock nor reservation counts authorize a run.
    concurrency:
      group: integration-live-${{ needs.setup.outputs.live-scope }}
      cancel-in-progress: false
    uses: ./.github/workflows/int_test_bundle.yml
    with:
      cohorts: ${{ needs.setup.outputs.cohorts }}
      # Neither `env` nor `secrets` is supported in reusable-job inputs.
      # Preserve an empty subscription input; the cohort resolves the secret fallback.
      resource-group: ${{ inputs['resource-group'] || 'cli-int-test-rg' }}
      subscription-id: ${{ inputs['subscription-id'] }}
      dps-capacity-limit: ${{ inputs['dps-capacity-limit'] }}
      adr-test-filter: ${{ inputs['adr-test-filter'] }}
      adr-revoke-certificates: ${{ inputs['adr-revoke-certificates'] == true }}
    secrets: inherit

  int-test-gate:
    name: "Integration test gate"
    needs: [setup, unit-test, int-test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout source"
        uses: actions/checkout@v5

      - name: "Download all test results"
        uses: actions/download-artifact@v7
        with:
          pattern: test-result-*
          path: ./test-results

      - name: "Evaluate per-service results"
        if: ${{ always() }}
        env:
          INTEGRATION_MATRIX: ${{ needs.setup.outputs.matrix || '[]' }}
          SETUP_RESULT: ${{ needs.setup.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
          INTEGRATION_RESULT: ${{ needs.int-test.result }}
          GATE_JOB_RESULT: ${{ job.status }}
          DPS_CAPACITY_LIMIT: ${{ inputs['dps-capacity-limit'] }}
        run: >-
          python3 azext_iot/tests/_evaluate_test_results.py --results-dir ./test-results
          --expected-dps-capacity-limit "$DPS_CAPACITY_LIMIT"

  combine-coverage:
    name: "Combine coverage reports"
    if: always()
    needs: [setup, unit-test, int-test, int-test-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout source"
        uses: actions/checkout@v5

      - name: "Download all coverage artifacts"
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: ./coverage_parts

      - name: "Combine coverage and generate report"
        run: |
          pip install coverage
          mapfile -t coverage_files < <(find ./coverage_parts -type f -name .coverage)
          if [ "${#coverage_files[@]}" -gt 0 ]; then
            coverage combine "${coverage_files[@]}"
            coverage report
            coverage html --directory ./htmlcov
          else
            echo "No coverage files found — skipping combine/report."
            echo "### ⚠️ No coverage data collected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Upload combined coverage artifact"
        uses: actions/upload-artifact@v6
        with:
          name: combined-coverage
          overwrite: true
          path: ./htmlcov
          retention-days: 30

      - name: "Write job summary"
        if: ${{ always() }}
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
          INTEGRATION_RESULT: ${{ needs.int-test.result }}
          GATE_RESULT: ${{ needs.int-test-gate.result }}
          COVERAGE_RESULT: ${{ job.status }}
        run: |
          if [ "$SETUP_RESULT" = "success" ] && [ "$UNIT_TEST_RESULT" = "success" ] && \
             [ "$INTEGRATION_RESULT" = "success" ] && [ "$GATE_RESULT" = "success" ] && \
             [ "$COVERAGE_RESULT" = "success" ]; then
            echo "### All workflow checks passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Workflow did not succeed" >> "$GITHUB_STEP_SUMMARY"
            printf -- '- Matrix setup: %s\n- Unit tests: %s\n- Integration jobs: %s\n- Integration gate: %s\n- Coverage: %s\n' \
              "$SETUP_RESULT" "$UNIT_TEST_RESULT" "$INTEGRATION_RESULT" "$GATE_RESULT" "$COVERAGE_RESULT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

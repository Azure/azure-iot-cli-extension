name: Integration Tests
run-name: >-
  Integration Tests (${{ inputs['test-services'] || 'auto' }} | ${{ inputs.regions || 'westus' }})

on:
  # Reusable workflow trigger — called programmatically by other workflows (e.g. release_workflow.yml)
  workflow_call:
    inputs:
      test-services:
        description: "Comma-separated services to test (DPS,HubMgmt,HubData,ADU,ADR). 'auto' uses all services on branch."
        type: string
        required: false
        default: "auto"
      python-versions:
        description: "Python versions (comma-separated: 3.10,3.11,3.12,3.13)"
        type: string
        required: false
        default: "3.13"
      regions:
        description: "Azure regions (comma-separated)"
        type: string
        required: false
        default: "westus"
      resource-group:
        description: "Resource group for test resources"
        type: string
        required: false
        default: ""
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
  # Manual trigger — run from GitHub Actions UI with checkbox/input controls
  workflow_dispatch:
    inputs:
      testDPS:
        description: "Run DPS tests"
        type: boolean
        default: true
      testHubMgmt:
        description: "Run IoT Hub management tests"
        type: boolean
        default: true
      testHubData:
        description: "Run IoT Hub data-plane tests"
        type: boolean
        default: true
      testADU:
        description: "Run ADU tests"
        type: boolean
        default: true
      testADR:
        description: "Run ADR tests"
        type: boolean
        default: true
      python-versions:
        description: "Python versions (comma-separated: 3.10,3.11,3.12,3.13)"
        type: string
        required: false
        default: "3.13"
      regions:
        description: "Azure regions (comma-separated)"
        type: string
        required: false
        default: "westus"
      resource-group:
        description: "Resource group for test resources"
        type: string
        required: false
        default: ""

permissions:
  contents: "read"
  id-token: "write"

env:
  RESOURCE_GROUP: "${{ inputs['resource-group'] || 'cli-int-test-rg' }}"

jobs:
  setup:
    name: "Detect test matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: "Checkout source"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            azext_iot/tests

      - name: "Build test matrix"
        id: matrix
        env:
          INPUT_SERVICES: ${{ inputs['test-services'] }}
          INPUT_PYTHON_VERSIONS: ${{ inputs['python-versions'] || '3.13' }}
          INPUT_REGIONS: ${{ inputs.regions || 'westus' }}
          INPUT_TEST_DPS: ${{ inputs.testDPS }}
          INPUT_TEST_HUB_MGMT: ${{ inputs.testHubMgmt }}
          INPUT_TEST_HUB_DATA: ${{ inputs.testHubData }}
          INPUT_TEST_ADU: ${{ inputs.testADU }}
          INPUT_TEST_ADR: ${{ inputs.testADR }}
        run: |
          set -euo pipefail
          # --- Service registry: service|test_dir|tox_env|timeout ---
          all_services=(
            "DPS|azext_iot/tests/dps|DPS-int|90"
            "HubMgmt|azext_iot/tests/iothub|HubMgmt-int|120"
            "HubData|azext_iot/tests/iothub|HubData-int|120"
            "ADU|azext_iot/tests/deviceupdate|ADU-int|200"
            "ADR|azext_iot/tests/adr|ADR-int|200"
          )

          # --- Determine which services to include ---
          input_services="$INPUT_SERVICES"
          services=""

          if [ -z "$input_services" ]; then
            # Direct workflow_dispatch: filter by boolean toggles + directory existence
            declare -A toggles=(
              [DPS]="$INPUT_TEST_DPS"
              [HubMgmt]="$INPUT_TEST_HUB_MGMT"
              [HubData]="$INPUT_TEST_HUB_DATA"
              [ADU]="$INPUT_TEST_ADU"
              [ADR]="$INPUT_TEST_ADR"
            )
            for entry in "${all_services[@]}"; do
              IFS='|' read -r svc test_dir tox_env timeout <<< "$entry"
              [ "${toggles[$svc]}" = "true" ] && [ -d "$test_dir" ] && services="${services}${svc},"
            done
          elif [ "$input_services" = "auto" ]; then
            # auto: include all services whose test directory exists on this branch
            for entry in "${all_services[@]}"; do
              IFS='|' read -r svc test_dir tox_env timeout <<< "$entry"
              [ -d "$test_dir" ] && services="${services}${svc},"
            done
          else
            services="$input_services,"
          fi
          services="${services%,}" # trim trailing comma

          if [ -z "$services" ]; then
            echo "::error::No services selected or no test directories found on this branch."
            exit 1
          fi

          python_versions="$INPUT_PYTHON_VERSIONS"
          regions="$INPUT_REGIONS"

          echo "Services: $services"
          echo "Python versions: $python_versions"
          echo "Regions: $regions"

          # --- Build JSON matrix: service × python × region ---
          matrix="["
          first=true

          IFS=',' read -ra SVC_ARRAY <<< "$services"
          IFS=',' read -ra PY_ARRAY <<< "$python_versions"
          IFS=',' read -ra REGION_ARRAY <<< "$regions"

          for svc in "${SVC_ARRAY[@]}"; do
            svc=$(echo "$svc" | xargs)
            # Look up metadata from registry
            tox_env=""; timeout=""
            for entry in "${all_services[@]}"; do
              IFS='|' read -r s d t tm <<< "$entry"
              [ "$s" = "$svc" ] && tox_env="$t" && timeout="$tm" && break
            done
            if [ -z "$tox_env" ]; then
              echo "::warning::Unknown service: $svc"
              continue
            fi

            for py in "${PY_ARRAY[@]}"; do
              py=$(echo "$py" | xargs)
              for region in "${REGION_ARRAY[@]}"; do
                region=$(echo "$region" | xargs)

                if [ "$first" = true ]; then first=false; else matrix="$matrix,"; fi
                matrix="$matrix{\"service\":\"$svc\",\"tox_env\":\"$tox_env\",\"timeout\":$timeout,\"python\":\"$py\",\"region\":\"$region\"}"
              done
            done
          done
          matrix="$matrix]"

          job_count=$(echo "$matrix" | jq length)
          echo ""
          echo "┌──────────────────────────────────────────────────────────┐"
          title="Test Matrix: $job_count job(s)"
          printf "│  %-56s│\n" "$title"
          echo "├───────────┬─────────┬──────────────┬─────────────────────┤"
          echo "│  Service  │ Python  │    Region    │  Timeout            │"
          echo "├───────────┼─────────┼──────────────┼─────────────────────┤"
          echo "$matrix" | jq -r '.[] | "│  \(.service)\(" " * (9 - (.service | length)))│ \(.python)\(" " * (8 - (.python | length)))│  \(.region)\(" " * (12 - (.region | length)))│  \(.timeout) min\(" " * (19 - ((.timeout | tostring) + " min" | length)))│"'
          echo "└───────────┴─────────┴──────────────┴─────────────────────┘"
          echo ""
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

          # --- Write summary table ---
          echo "## Test Matrix ($(echo "$matrix" | jq length) jobs)" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Python | Region | Timeout |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "$matrix" | jq -r '.[] | "| \(.service) | \(.python) | \(.region) | \(.timeout) min |"' >> $GITHUB_STEP_SUMMARY

  unit-test:
    name: "Linter and unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "Setup Python 3.13"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip" # Cache pip downloads to avoid re-downloading packages across runs

      - name: "Setup test suite"
        run: |
          python -m pip install tox
          tox r -vv --notest

      - name: "Run linter and unit tests"
        run: tox r --skip-pkg-install

      - name: "Upload coverage report"
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-unit
          path: ./.coverage
          include-hidden-files: true
          retention-days: 30

  int-test:
    name: "${{ matrix.config.service }} py${{ matrix.config.python }} (${{ matrix.config.region }})"
    needs: [setup, unit-test]
    if: ${{ needs.setup.result == 'success' && (needs.setup.outputs.matrix || '[]') != '[]' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: ${{ matrix.config.timeout }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.matrix || '[]') }}
    steps:
      - name: "Checkout source"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "Setup Python ${{ matrix.config.python }}"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "${{ matrix.config.python }}"
          cache: "pip" # Saves ~30-60s per matrix job by caching pip downloads

      - name: "Build and install extension"
        run: |
          pip install -r dev_requirements
          python -m build
          az extension add --source ./dist/*.whl -y
          # az CLI uses its own Python (e.g. 3.13) to install deps into the extension dir.
          # Binary packages like rpds-py and cryptography have version-specific .so files
          # that won't load under a different Python. Reinstall them for the test Python version.
          ext_dir=$(az extension show -n azure-iot --query path -o tsv 2>/dev/null || echo "")
          if [ -n "$ext_dir" ] && [ -d "$ext_dir" ]; then
            pip install --target "$ext_dir" --upgrade --force-reinstall --no-deps rpds-py cryptography
          fi

      - name: "Setup tox test environment"
        run: |
          pip install tox
          tox r -vv -e ${{ matrix.config.tox_env }} --notest

      - name: "Az CLI login"
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "Verify Azure access"
        run: |
          az account show -o table
          az group show -n ${{ env.RESOURCE_GROUP }} -o table

      - name: "OIDC Token refresh service"
        run: |
          while true; do
            token_request=$ACTIONS_ID_TOKEN_REQUEST_TOKEN
            token_uri=$ACTIONS_ID_TOKEN_REQUEST_URL
            token=$(curl -sH "Authorization: bearer $token_request" "${token_uri}&audience=api://AzureADTokenExchange" | jq .value -r)
            az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -t ${{ secrets.AZURE_TENANT_ID }} --federated-token $token --output none
            sleep 240
          done &

      - name: "Run ${{ matrix.config.service }} integration tests"
        id: run_tests
        env:
          AZURE_TEST_RUN_LIVE: "True"
          azext_iot_testrg: ${{ env.RESOURCE_GROUP }}
          azext_iot_adr_location: ${{ matrix.config.region }}
        run: |
          set -o pipefail
          tox r -e ${{ matrix.config.tox_env }} --skip-pkg-install 2>&1 | \
            sed 's/SharedAccessKey=[^;& "'"'"']*//g; s/AccountKey=[^;& "'"'"']*//g; s/sig=[^&"]*//g' | \
            sed 's/\("primaryKey"\s*:\s*\)"[^"]*"/\1"***"/g; s/\("secondaryKey"\s*:\s*\)"[^"]*"/\1"***"/g' | \
            sed 's/--pk [^ ]*/--pk ***/g; s/--sk [^ ]*/--sk ***/g; s/--key [^ ]*/--key ***/g' | \
            sed 's/--login [^ ]*/--login ***/g; s/-l [^ ]*/--login ***/g; s/--connection-string [^ ]*/--connection-string ***/g' | \
            tee test-output.log

      - name: "Record test result"
        if: ${{ always() }}
        run: |
          mkdir -p test-result
          echo '${{ steps.run_tests.outcome }}' > test-result/status.txt
          echo '${{ matrix.config.service }}' > test-result/service.txt
          echo '${{ matrix.config.python }}' > test-result/python.txt
          echo '${{ matrix.config.region }}' > test-result/region.txt
          # Extract failed/errored test names from pytest output
          if [ -f test-output.log ]; then
            grep -E '^FAILED |^ERROR ' test-output.log | sed 's/^FAILED //;s/^ERROR //;s/ - .*$//' > test-result/failures.txt || true
          fi
          touch test-result/failures.txt

      - name: "Upload test result"
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-result-${{ matrix.config.service }}-py${{ matrix.config.python }}-${{ matrix.config.region }}
          path: test-result/
          retention-days: 1

      - name: "Upload coverage artifact"
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.config.service }}-py${{ matrix.config.python }}-${{ matrix.config.region }}
          path: ./.coverage
          include-hidden-files: true
          retention-days: 30

  int-test-gate:
    name: "Integration test gate"
    needs: [int-test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: "Download all test results"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: test-result-*
          path: ./test-results

      - name: "Evaluate per-service results"
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Python | Region | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          gate_pass=true
          result_count=0
          declare -A service_pass
          declare -A service_fail

          for result_dir in ./test-results/test-result-*; do
            [ -d "$result_dir" ] || continue
            service=$(cat "$result_dir/service.txt")
            status=$(cat "$result_dir/status.txt")
            python=$(cat "$result_dir/python.txt")
            region=$(cat "$result_dir/region.txt")
            icon=$( [ "$status" = "success" ] && echo "✅" || echo "❌" )
            echo "| $service | $python | $region | $icon $status |" >> $GITHUB_STEP_SUMMARY

            result_count=$((result_count + 1))
            if [ "$status" = "success" ]; then
              service_pass[$service]=1
            else
              service_fail[$service]=$(( ${service_fail[$service]:-0} + 1 ))
            fi
          done

          if [ "$result_count" -eq 0 ]; then
            echo "::notice::No integration test results found — all jobs were skipped or cancelled"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⏭️ Integration tests were skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No test results were produced. This is expected when a prerequisite job (e.g. linter or unit tests) failed." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Show failed test details
          has_failures=false
          for result_dir in ./test-results/test-result-*; do
            [ -d "$result_dir" ] || continue
            if [ -s "$result_dir/failures.txt" ]; then
              if [ "$has_failures" = false ]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "## Failed Tests" >> $GITHUB_STEP_SUMMARY
                has_failures=true
              fi
              service=$(cat "$result_dir/service.txt")
              python=$(cat "$result_dir/python.txt")
              region=$(cat "$result_dir/region.txt")
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary><b>$service</b> py$python ($region) — $(wc -l < "$result_dir/failures.txt") failed</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat "$result_dir/failures.txt" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          for svc in $(echo "${!service_pass[@]} ${!service_fail[@]}" | tr ' ' '\n' | sort -u); do
            pass_count=${service_pass[$svc]:-0}
            fail_count=${service_fail[$svc]:-0}
            if [ "$pass_count" -gt 0 ] && [ "$fail_count" -gt 0 ]; then
              echo "::warning::$svc: $fail_count combination(s) failed but at least one passed — not blocking release"
            elif [ "$pass_count" -eq 0 ]; then
              echo "::error::$svc: ALL combinations failed"
              gate_pass=false
            fi
          done

          if [ "$gate_pass" = false ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ Gate FAILED — one or more services had zero successful runs" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Gate passed — every service has at least one successful run" >> $GITHUB_STEP_SUMMARY

  combine-coverage:
    name: "Combine coverage reports"
    if: always()
    needs: [unit-test, int-test, int-test-gate]
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "Download all coverage artifacts"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: ./coverage_parts

      - name: "Combine coverage and generate report"
        run: |
          pip install coverage
          if compgen -G "./coverage_parts/*/.coverage" > /dev/null; then
            coverage combine ./coverage_parts/*/.coverage
            coverage report
            coverage html --directory ./htmlcov
          else
            echo "No coverage files found — skipping combine/report."
            echo "### ⚠️ No coverage data collected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Write job summary"
        if: ${{ always() }}
        run: |
          if [ "${{ needs.unit-test.result }}" = "success" ] && [ "${{ needs.int-test-gate.result }}" = "success" ]; then
            echo "### All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Test failures detected" >> $GITHUB_STEP_SUMMARY
            [ "${{ needs.unit-test.result }}" != "success" ] && echo "- Unit tests: ${{ needs.unit-test.result }}" >> $GITHUB_STEP_SUMMARY
            [ "${{ needs.int-test-gate.result }}" != "success" ] && echo "- Integration tests: ${{ needs.int-test-gate.result }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Upload combined coverage artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: combined-coverage
          path: ./htmlcov
          retention-days: 30

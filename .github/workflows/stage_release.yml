name: "[auto] Draft Github Release"
permissions: {}

on:
  workflow_call:

jobs:
  create_draft_release:
    runs-on:
      - self-hosted
      - 1ES.Pool=iotupx-iot-cli-github-hosted-pool
      - 1ES.ImageOverride=Ubuntu20.04Compliant
    permissions:
      # needed to create a draft release
      contents: write
    steps:
      - name: Download Wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: azure-iot-cli-ext
          path: ./release
      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install and determine version
        run: |
          wheel=$(find ./release/*.whl)
          pip install $wheel
          version=$(pip show azure_iot | grep Version: | awk '{print $2}')
          echo "wheel=$wheel" >> $GITHUB_ENV
          echo "version=$version" >> $GITHUB_ENV
          echo "tag=v$version" >> $GITHUB_ENV
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SBOM
          path: ./release/SBOM
      - name: Zip SBOM
        run: zip ./SBOM.zip ./release/SBOM -r
      - name: Create Release
        run: |
          echo tag: "${{ env.tag }}"
          echo version: "${{ env.version }}"
          echo wheel: "${{ env.wheel }}"
          echo target: "${{ github.ref }}"
          gh release create --draft \
          "${{ env.tag }}" \
          "${{ env.wheel }}" \
          "./SBOM.zip#SBOM" \
          --repo "${{ github.repository }}" \
          --target "${{ github.ref }}" \
          --title "azure-iot ${{ env.version }}" \
          --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

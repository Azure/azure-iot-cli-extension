name: "Integration Tests (scheduler)"
run-name: "Dispatch integration tests → ${{ github.event_name == 'schedule' && 'auto' || 'manual' }}"

on:
    schedule:
        # preview: once per day on weekdays; dev: once per week on Saturday.
        - cron: "17 8 * * 1-5" # Weekdays 12:17 AM PT (08:17 UTC) → preview
        - cron: "17 8 * * 6" # Saturday 12:17 AM PT (08:17 UTC) → dev
        # Release: daily after the 13:00 UTC shared-resource cleanup; region alternates by UTC day.
        - cron: "17 14 * * *"
    workflow_dispatch:

permissions:
    contents: "read"
    actions: "write"

jobs:
    dispatch:
        name: "Dispatch to target branch"
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: github.repository == 'Azure/azure-iot-cli-extension'
        steps:
            - name: "Compute rotation and dispatch"
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TRIGGER_SCHEDULE: ${{ github.event.schedule }}
                  AZURE_DEVOPS_EXT_PAT: ${{ secrets.ADO_PAT }}
              run: |
                  set -euo pipefail

                  if [ "$TRIGGER_SCHEDULE" = "17 14 * * *" ]; then
                    # Epoch-day parity preserves the region alternation across month/year boundaries.
                    release_regions=("australiaeast" "centralus")
                    utc_day=$(( $(date -u +%s) / 86400 ))
                    release_region="${release_regions[$(( utc_day % ${#release_regions[@]} ))]}"

                    # Release runs call int_test.yml as a reusable workflow, so their runs are listed under
                    # release_workflow.yml. A release paused at approval (waiting) has finished its tests.
                    for check in \
                      "int_test.yml:requested queued pending in_progress waiting" \
                      "release_workflow.yml:requested queued pending in_progress"; do
                      workflow="${check%%:*}"
                      for status in ${check#*:}; do
                        active_runs=$(gh api \
                          "repos/$GH_REPO/actions/workflows/$workflow/runs?status=$status&per_page=1" \
                          --jq '.total_count')
                        if [ "$active_runs" != "0" ]; then
                          echo "Skipping release integration tests: GitHub $workflow runs are $status."
                          exit 0
                        fi
                      done
                    done

                    if [ -z "$AZURE_DEVOPS_EXT_PAT" ]; then
                      echo "::error::ADO_PAT is required to check shared-resource cleanup and integration runs."
                      exit 1
                    fi
                    ado_args=(--organization https://dev.azure.com/azureiotdevxp --project aziotcli --detect false)
                    for status in inProgress notStarted cancelling postponed; do
                      active_runs=$(az pipelines runs list "${ado_args[@]}" \
                        --pipeline-ids 109 147 --status "$status" --top 1 \
                        --query 'length(@)' --output tsv)
                      if [ "$active_runs" != "0" ]; then
                        echo "Skipping release integration tests: ADO cleanup or integration runs are $status."
                        exit 0
                      fi
                    done
                    today=$(date -u +%F)
                    cleanup_ready=$(az pipelines runs list "${ado_args[@]}" \
                      --pipeline-ids 109 --top 1 \
                      --query "[?status=='completed' && starts_with(finishTime || '', '$today')] | length(@)" \
                      --output tsv)
                    if [ "$cleanup_ready" != "1" ]; then
                      echo "Skipping release integration tests: today's cleanup has not completed."
                      exit 0
                    fi

                    echo "Dispatching release/1.0.0-preview: Python 3.13, Region $release_region"
                    gh workflow run int_test.yml \
                      --repo "$GH_REPO" \
                      --ref release/1.0.0-preview \
                      -f python-versions=3.13 \
                      -f regions="$release_region" \
                      -f arm-endpoint=public \
                      -f resource-group=cli-int-test-rg \
                      -f subscription-id=a386d5ea-ea90-441a-8263-d816368c84a1
                    exit 0
                  fi

                  # Determine target branch based on day of week
                  # Weekdays (Mon-Fri) → preview, Saturday → dev
                  day_of_week=$(date -u +"%u")  # 1=Mon ... 6=Sat, 7=Sun
                  if [ "$day_of_week" = "6" ]; then
                    branch="dev"
                  else
                    branch="preview"
                  fi

                  # Rotate Python version and region using day-of-year as seed
                  py_versions=("3.10" "3.11" "3.12" "3.13")
                  region_list=("eastus" "westus" "northeurope" "westeurope")
                  day_of_year=$(date -u +"%j")
                  py_idx=$(( day_of_year % ${#py_versions[@]} ))
                  rg_idx=$(( (day_of_year / ${#py_versions[@]}) % ${#region_list[@]} ))
                  python_ver="${py_versions[$py_idx]}"
                  region="${region_list[$rg_idx]}"

                  echo "Dispatching to $branch: Python $python_ver, Region $region"
                  gh workflow run int_test.yml \
                    --repo "${{ github.repository }}" \
                    --ref "$branch" \
                    -f python-versions="$python_ver" \
                    -f regions="$region" || echo "::warning::Failed to dispatch to $branch (branch may not exist)"

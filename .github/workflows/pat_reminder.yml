name: PAT Renewal Reminder

on:
  schedule:
    # Run daily at 9 AM UTC — the job checks if PAT is near expiry
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-pat-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Check PAT and remind if near expiry
        env:
          DASHBOARD_PAT: ${{ secrets.DASHBOARD_PAT }}
          DASHBOARD_PAT_EXPIRY: ${{ secrets.DASHBOARD_PAT_EXPIRY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # DASHBOARD_PAT_EXPIRY should be set as a secret in YYYY-MM-DD format
          # e.g., "2026-08-25" (the PAT expiry date)
          if [ -z "$DASHBOARD_PAT_EXPIRY" ]; then
            echo "DASHBOARD_PAT_EXPIRY secret not set. Skipping reminder."
            exit 0
          fi

          expiry_epoch=$(date -d "$DASHBOARD_PAT_EXPIRY" +%s 2>/dev/null)
          now_epoch=$(date +%s)
          days_left=$(( (expiry_epoch - now_epoch) / 86400 ))

          echo "PAT expires on: $DASHBOARD_PAT_EXPIRY"
          echo "Days remaining: $days_left"

          if [ "$days_left" -le 10 ]; then
            # Check if an open reminder issue already exists
            existing=$(gh issue list -R Azure/azure-iot-cli-extension \
              --label "pat-renewal" --state open --json number -q '.[0].number' 2>/dev/null || echo "")

            if [ -n "$existing" ]; then
              echo "Reminder issue #$existing already exists. Skipping."
              exit 0
            fi

            gh issue create -R Azure/azure-iot-cli-extension \
              --title "🔑 DASHBOARD_PAT expires in $days_left days — renew before $DASHBOARD_PAT_EXPIRY" \
              --body "## PAT Renewal Required

          The \`DASHBOARD_PAT\` secret used by the Integration Tests Dashboard expires on **$DASHBOARD_PAT_EXPIRY** ($days_left days remaining).

          ### Steps to renew:
          1. Go to [GitHub Token Settings](https://github.com/settings/tokens)
          2. Create a new fine-grained PAT with **Actions: Read-only** access for:
             - \`Azure/azure-iot-cli-extension\`
             - \`Azure/azure-iot-ops-cli-extension\`
          3. Set expiration to **90 days**
          4. Authorize SSO for the Azure org
          5. Update the \`DASHBOARD_PAT\` secret in both repos:
             - [azure-iot-cli-extension secrets](https://github.com/Azure/azure-iot-cli-extension/settings/secrets/actions)
             - [azure-iot-ops-cli-extension secrets](https://github.com/Azure/azure-iot-ops-cli-extension/settings/secrets/actions)
          6. Update the \`DASHBOARD_PAT_EXPIRY\` secret with the new expiry date (YYYY-MM-DD)

          This issue was auto-created by the PAT Renewal Reminder workflow." \
              --label "pat-renewal"

            echo "Created reminder issue."
          else
            echo "PAT still valid for $days_left days. No action needed."
          fi

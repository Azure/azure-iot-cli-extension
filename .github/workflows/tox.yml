name: Tox tests
on:
  workflow_call:
    inputs:
      continue-on-error:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      continue-on-error:
        description: Continue on error for tests
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  tox:
    name: Unit test ${{ matrix.py }} - ${{ matrix.os }}
    continue-on-error: ${{ inputs.continue-on-error }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15-intel
        py:
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
    steps:
      - name: Setup python ${{ matrix.py }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.py }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select OpenSSL 3 for CSR signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          source scripts/select-openssl.sh
          echo "$openssl_bin" >> "$GITHUB_PATH"
      - name: Setup test suite
        run: |
          python -m pip install tox
          tox r -vv --notest
      - name: Run test suite
        run: tox r --skip-pkg-install
      - name: Upload coverage report
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.py == '3.13' }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: code-coverage
          path: htmlcov/

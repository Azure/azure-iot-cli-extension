name: Tox tests
on:
  workflow_call:
    inputs:
      continue-on-error:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      continue-on-error:
        description: Continue on error for tests
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  tox:
    name: Unit test ${{ matrix.py }} - ${{ matrix.os }} (shard ${{ matrix.shard }}/4)
    continue-on-error: ${{ inputs.continue-on-error }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15-intel
        py:
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
        shard: [1, 2, 3, 4]
    steps:
      - name: Setup python ${{ matrix.py }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.py }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select OpenSSL 3 for CSR signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          source scripts/select-openssl.sh
          echo "$openssl_bin" >> "$GITHUB_PATH"
      - name: Setup test suite
        run: |
          python -m pip install tox
          python -m tox r -e python-azcur-unit -vv --notest
      - name: Run test suite
        env:
          UNIT_RUN_ID: "github:${{ github.repository }}:${{ github.run_id }}:tox:${{ matrix.os }}:py${{ matrix.py }}"
          UNIT_COMMIT: ${{ github.sha }}
          UNIT_ATTEMPT: ${{ github.run_attempt }}
          COVERAGE_FILE: ${{ github.workspace }}/unit-result/coverage.dat
        run: >-
          python -m tox r -e python-azcur-unit --skip-pkg-install --
          -p azext_iot.tests._unit_shard_plugin --unit-shard ${{ matrix.shard }}
          --unit-shard-output unit-result --junitxml unit-result/junit.xml
      - name: Upload unit shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tox-unit-${{ matrix.os }}-py${{ matrix.py }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: unit-result/
          if-no-files-found: error
          retention-days: 30
      - name: Run lint once per OS and Python
        if: ${{ matrix.shard == 1 }}
        run: python -m tox r -e lint -vv

  unit-gate:
    name: Unit test ${{ matrix.py }} - ${{ matrix.os }}
    needs: tox
    if: ${{ always() }}
    continue-on-error: ${{ inputs.continue-on-error }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15-intel
        py:
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
    steps:
      - name: Require successful unit shards and lint
        if: ${{ needs.tox.result != 'success' }}
        run: |
          echo "::error::Unit shards or lint did not succeed (${{ needs.tox.result }})."
          exit 1
      - name: Setup python ${{ matrix.py }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.py }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Download this matrix combination's unit evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: tox-unit-${{ matrix.os }}-py${{ matrix.py }}-*
          path: unit-history
      - name: Install coverage
        run: python -m pip install coverage
      - name: Verify complete unit execution and combine coverage
        env:
          UNIT_RUN_ID: "github:${{ github.repository }}:${{ github.run_id }}:tox:${{ matrix.os }}:py${{ matrix.py }}"
          UNIT_COMMIT: ${{ github.sha }}
        run: >-
          python azext_iot/tests/_unit_shards.py --history unit-history --output unit-coverage
          --prefix tox-unit-${{ matrix.os }}-py${{ matrix.py }}
      - name: Generate coverage reports
        env:
          COVERAGE_FILE: ${{ github.workspace }}/unit-coverage/.coverage
        run: python -m coverage report && python -m coverage html && python -m coverage json
      - name: Upload verified unit results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tox-summary-${{ matrix.os }}-py${{ matrix.py }}-${{ github.run_attempt }}
          path: unit-coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload coverage report
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.py == '3.13' }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: code-coverage
          path: htmlcov/

# INTERNAL: called once by int_test.yml while its subscription/RG lock is held.
# No dispatch trigger and no nested concurrency group: siblings must never contend
# for the caller's lock (or replace another pending sibling).
name: Integration test bundle (internal)

on:
  workflow_call:
    inputs:
      cohorts:
        description: "Validated Python/region cohorts: owned services together, ADU separately."
        type: string
        required: true
      resource-group:
        type: string
        required: true
      subscription-id:
        type: string
        required: false
        default: ""
      adr-test-filter:
        type: string
        default: ""
      adr-revoke-certificates:
        type: boolean
        default: false
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  cohort:
    name: "py${{ matrix.cohort.python }} (${{ matrix.cohort.region }})"
    # A reusable matrix job completes only after ALL its service jobs finish,
    # including their cleanup/artifact steps. Only then may another cohort start.
    # This bounds same-service consumers while parallelizing the four owned suites.
    # ADU remains a separate serial cohort; its legacy consumers are not qualified
    # to overlap the owned-service cohort.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cohort: ${{ fromJson(inputs.cohorts) }}
    uses: ./.github/workflows/int_test_cohort.yml
    with:
      configs: ${{ toJson(matrix.cohort.configs) }}
      resource-group: ${{ inputs['resource-group'] }}
      subscription-id: ${{ inputs['subscription-id'] }}
      adr-test-filter: ${{ inputs['adr-test-filter'] }}
      adr-revoke-certificates: ${{ inputs['adr-revoke-certificates'] }}
    secrets: inherit

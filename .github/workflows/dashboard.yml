name: Integration Tests Dashboard

on:
  # Run every 2 hours
  schedule:
    - cron: '0 */2 * * *'

  # Manual trigger
  workflow_dispatch:

  # Refresh after integration tests complete (same repo)
  workflow_run:
    workflows: ["Integration Tests"]
    types: [completed]

  # Refresh triggered by azure-iot-ops-cli-extension after its integration tests
  repository_dispatch:
    types: [refresh-dashboard]

# Prevent overlapping deployments
concurrency:
  group: dashboard-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate dashboard
        env:
          # DASHBOARD_PAT: PAT with Actions:read for both repos (renew every 90 days)
          # GITHUB_TOKEN: same-repo fallback (auto-provided, never expires)
          DASHBOARD_PAT: ${{ secrets.DASHBOARD_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: _site
        run: python docs/dashboard/generate.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add dashboard link to workflow summary
        run: |
          echo "## Integration Tests Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dashboard deployed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[View Dashboard](${{ steps.deployment.outputs.page_url }})**" >> $GITHUB_STEP_SUMMARY

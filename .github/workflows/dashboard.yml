name: Azure IoT CLI Dashboard

on:
  # Manual trigger
  workflow_dispatch:

  # Refresh after integration tests complete (same repo)
  workflow_run:
    workflows: ["Integration Tests"]
    types: [completed]

  # Refresh triggered by azure-iot-ops-cli-extension after its integration tests
  repository_dispatch:
    types: [refresh-dashboard]

# Prevent overlapping runs
concurrency:
  group: dashboard
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DASHBOARD_APP_ID }}
          private-key: ${{ secrets.DASHBOARD_APP_PRIVATE_KEY }}
          owner: Azure
          repositories: azure-iot-cli-extension,azure-iot-ops-cli-extension

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate dashboard
        env:
          DASHBOARD_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: docs/dashboard
        run: python docs/dashboard/generate.py

      - name: Commit and push dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard/index.html
          if git diff --cached --quiet; then
            echo "No changes to dashboard"
          else
            git commit -m "Update dashboard [skip ci]"
            git push
          fi

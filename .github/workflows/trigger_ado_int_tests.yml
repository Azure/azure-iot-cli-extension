# checkov:skip=CKV_GHA_7:workflow_dispatch selections are validated and serialized as pipeline parameters
name: Run Azure DevOps Integration Tests
permissions: {}
on:
  workflow_call:
    inputs:
      testDPS:
        description: Run DPS tests
        type: boolean
        default: true
      testHub:
        description: Run HubControl and full HubData (owned Linux phases; Windows unsupported)
        type: boolean
        default: true
      testADU:
        description: Run ADU tests
        type: boolean
        default: true
      testADR:
        description: Run ADR tests
        type: boolean
        default: true
      python_versions:
        description: "Comma-separated Python versions to test"
        type: string
        default: "3.10,3.11,3.12,3.13"
    secrets:
      ADO_PAT:
        required: true
  workflow_dispatch:
    inputs:
      testDPS:
        description: Run DPS tests
        type: boolean
        default: true
      testHub:
        description: Run HubControl and full HubData (owned Linux phases; Windows unsupported)
        type: boolean
        default: true
      testADU:
        description: Run ADU tests
        type: boolean
        default: true
      testADR:
        description: Run ADR tests
        type: boolean
        default: true
      python_versions:
        description: "Comma-separated Python versions to test"
        required: true
        type: string
        default: "3.10,3.11,3.12,3.13"
env:
  DEFAULT_TITLE: "Azure DevOps Pipeline"
  AZURE_DEVOPS_EXT_PAT: ${{ secrets.ADO_PAT }}
  DEFINITION_ID: 147
  ORG: azureiotdevxp
  PROJECT: aziotcli
jobs:
  call-ado-pipeline:
    permissions: {}
    runs-on: ubuntu-latest
    name: Run integration tests
    outputs:
      runId: ${{ steps.start.outputs.runId }}
      portalUrl: ${{ steps.start.outputs.portalUrl }}
      url: ${{ steps.start.outputs.url }}
    steps:
      - shell: bash
        id: start
        name: Trigger the pipeline
        env:
          TEST_DPS: ${{ inputs.testDPS }}
          TEST_HUB: ${{ inputs.testHub }}
          TEST_ADU: ${{ inputs.testADU }}
          TEST_ADR: ${{ inputs.testADR }}
          PYTHON_VERSIONS: ${{ inputs.python_versions }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |-
          set -euo pipefail
          : "${ORG:?Organization is required}"
          : "${PROJECT:?Project is required}"
          : "${DEFINITION_ID:?Pipeline definition ID is required}"
          request=$(mktemp)
          trap 'rm -f "$request"' EXIT
          jq -n \
            --argjson dps "$TEST_DPS" --argjson hub "$TEST_HUB" \
            --argjson adu "$TEST_ADU" --argjson adr "$TEST_ADR" \
            --arg python "$PYTHON_VERSIONS" --arg ref "$SOURCE_REF" --arg sha "$SOURCE_SHA" '
            {
              resources: {repositories: {self: {refName: $ref, version: $sha}}},
              templateParameters: {
                mode: "Integration tests",
                services: [
                  (if $dps then "DPS" else empty end),
                  (if $hub then "HubControl", "HubData" else empty end),
                  (if $adu then "ADU" else empty end),
                  (if $adr then "ADR" else empty end)
                ],
                pythonVersions: ($python | split(",") | map(gsub("^[[:space:]]+|[[:space:]]+$"; "")))
              }
            }
            | if (.templateParameters.services | length) == 0 then
                error("Select at least one supported integration service.")
              elif (.templateParameters.pythonVersions | length) > 0 and
                all(.templateParameters.pythonVersions[];
                . == "3.10" or . == "3.11" or . == "3.12" or . == "3.13") then .
              else error("Python versions must be a comma-separated selection of 3.10,3.11,3.12,3.13.")
              end
            | .templateParameters.services |= tojson
            | .templateParameters.pythonVersions |= tojson' > "$request"
          res=$(az devops invoke --org "https://dev.azure.com/$ORG" \
            --area pipelines --resource runs \
            --route-parameters project="$PROJECT" pipelineId="$DEFINITION_ID" \
            --api-version 7.1 --http-method POST --in-file "$request" --output json)
          runId=$(jq -er '
            if (.id | type) == "number" and .id > 0 and .id == (.id | floor) then .id
            else error("ADO did not return a valid run ID.") end' <<< "$res")
          portalUrl="https://dev.azure.com/$ORG/$PROJECT/_build/results?buildId=$runId&view=results"
          url="https://dev.azure.com/$ORG/$PROJECT/_apis/build/builds/$runId"
          echo "runId=$runId" >> "$GITHUB_OUTPUT"
          echo "portalUrl=$portalUrl" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Summary
        id: summary
        run: |-
          echo "# ${PIPELINE:-$DEFAULT_TITLE} Started" >> $GITHUB_STEP_SUMMARY
          echo "## Azure DevOps Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "You can follow the progress [here](${{ steps.start.outputs.portalUrl }})" >> $GITHUB_STEP_SUMMARY

  wait-for-completion:
    permissions: {}
    runs-on: ubuntu-latest
    name: Wait for the pipeline to complete
    needs: [call-ado-pipeline]
    env:
      RUN_ID: ${{ needs.call-ado-pipeline.outputs.runId }}
      PORTAL_URL: ${{ needs.call-ado-pipeline.outputs.portalUrl }}
    steps:
      - name: Wait for the pipeline to complete
        run: |
          set -e
          runId="${{ needs.call-ado-pipeline.outputs.runId }}"
          status="none"
          result="none"
          lastLog=1
          while [[ "$status" =~ (inProgress|notStarted|postponed|none) ]]; do
            sleep 60
            res=$(az pipelines runs show --id "$RUN_ID" --org "https://dev.azure.com/$ORG" --project "$PROJECT")
            status=$(echo "$res" | jq -r '.status')
            result=$(echo "$res" | jq -r '.result')
          done

          # if status is not completed, or the result is one of failed, canceled; then fail the job
          if [[ "$status" != "completed" || "$result" =~ (failed|canceled) ]]; then
            echo "::error::Pipeline did not complete successfully"
            echo "# [FAILED] ${PIPELINE:-$DEFAULT_TITLE} Failed [FAILED]" >> $GITHUB_STEP_SUMMARY
            echo "The pipeline did not complete successfully. Please check the logs [here](${PORTAL_URL})" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "# [SUCCESS] ${PIPELINE:-$DEFAULT_TITLE} Completed [SUCCESS]" >> $GITHUB_STEP_SUMMARY
          echo "The pipeline completed successfully. You can check the logs [here](${PORTAL_URL})" >> $GITHUB_STEP_SUMMARY
  CancelPipeline:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [call-ado-pipeline, wait-for-completion]
    if: cancelled()
    env:
      RUN_ID: ${{ needs.call-ado-pipeline.outputs.runId }}
      RUN_URL: ${{ needs.call-ado-pipeline.outputs.url }}
      PORTAL_URL: ${{ needs.call-ado-pipeline.outputs.portalUrl }}
    steps:
      - name: Cancel the pipeline
        run: |
          set -ex
          if [[ -z "$RUN_ID" ]]; then
            echo "No pipeline to cancel"
            exit 0
          fi

          curl \
            -X PATCH \
            -u ":$AZURE_DEVOPS_EXT_PAT" \
            -H "Content-Type: application/json" \
            -d '{"status": "cancelling"}' \
            "${RUN_URL}?api-version=7.2-preview.7"
          echo "# [CANCELLED] ${PIPELINE:-$DEFAULT_TITLE} Cancelled [CANCELLED]" >> $GITHUB_STEP_SUMMARY
          echo "The pipeline was cancelled. You can check the logs [here](${PORTAL_URL})" >> $GITHUB_STEP_SUMMARY
